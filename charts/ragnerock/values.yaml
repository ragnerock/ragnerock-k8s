nameOverride: ~
fullnameOverride: ~

global:
  # -- Global container image configuration
  image:
    registry: us-central1-docker.pkg.dev/ragnerock-prod/ragnerock
    pullPolicy: IfNotPresent
    # -- Default image tag for all services. When empty, falls back to the chart's appVersion.
    tag: ""
  # -- Secrets use to authenticate with the container registry, list of `- name: <name of the secret>` values
  imagePullSecrets: []
  # -- Default pod tolerations applied to all workloads. Can be overridden per-service with `<service>.tolerations`. See https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []
  # -- Default pod affinity rules applied to all workloads. Can be overridden per-service with `<service>.affinity`. See https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}
  # -- Default annotations applied to the metadata of all workloads (Deployments/Job). Merged with per-service `<service>.annotations`, where per-service keys take precedence.
  annotations: {}
  # -- Number of replicaset revisions to keep around for deployments
  revisionHistoryLimit: 10

# -- Database configuration
database:
  host: ""
  port: 5432
  name: ragnerock
  user: ragnerock
  password: ""
  # -- Use a pre-existing secret (must provide key `DB_PASSWORD`) instead of generating one. When set, `password` is ignored.
  existingSecret: ""
  poolSize: 20
  maxOverflow: 40
  poolTimeout: 10

# -- LLM authentication configuration
llm:
  gemini:
    apiKey: ""
  mistral:
    apiKey: ""
  azure:
    apiKey: ""
    endpoint: ""
  textract:
    # -- AWS region the Textract API is called in. Required when `pdfParserBackend` is `textract`.
    region: ""
    # -- AWS access key ID. Required when `pdfParserBackend` is `textract`.
    accessKeyId: ""
    # -- AWS secret access key. Required when `pdfParserBackend` is `textract`.
    secretAccessKey: ""
    # -- Maximum concurrent Textract page requests per worker
    maxConcurrency: 4
    # -- Use a pre-existing secret (must provide key `AWS_SECRET_ACCESS_KEY`) instead of generating one. When set, `secretAccessKey` is ignored.
    existingSecret: ""

  # -- Use a pre-existing secret (must provide keys `GEMINI_API_KEY` and `MISTRAL_API_KEY`) instead of generating one. When set, `geminiApiKey`/`mistralApiKey` are ignored.
  existingSecret: ""
  # -- PDF parsing backend: `mistral`, `azure`, or `textract`
  pdfParserBackend: "mistral"
  # -- Extract embedded images from PDFs during parsing (for multimodal summarization)
  pdfExtractImages: true

encryption:
  # -- Key Encryption Key (KEK), generate with python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'
  kek: ""
  # -- Use a pre-existing secret (must provide key `ENCRYPTION_KEK`) instead of generating one. When set, `kek` is ignored.
  existingSecret: ""

# -- General app configuration
config:
  environmentIdentifier: ragnerock
  logLevel: INFO

ragnerock:
  # -- Should Ragnerock treat all prompts as unsafe
  safetyEnabled: true

# -- Otel metrics/traces/logs export
otel:
  enabled: false
  exporterEndpoint: ""
  exporterInsecure: false
  exporterProtocol: "http/protobuf"
  authHeader: ""
  # -- Use a pre-existing secret (must provide key `OTEL_EXPORTER_OTLP_HEADERS`) instead of generating one. When set, `authHeader` is ignored.
  existingSecret: ""

# -- Cloudtask configuration for use with in-cluster emulator
queue:
  jobQueueName: "ragnerock-document-jobs"
  subtaskQueueName: "ragnerock-subtask-jobs"
  callbackQueueName: "ragnerock-callbacks"
  auditQueueName: "ragnerock-audit"
  # -- Queue the audit-service enqueues its own /audit/export-run tasks onto
  auditExportQueueName: "audit-export-runs"
  maxDispatchesPerSecond: 500
  maxConcurrentDispatches: 500
  queuePoolSize: 100
  port: 8123
  # -- Deployment resoruce contraints (i.e. requests/limits)
  resources: {}
  # -- Optional horizontal pod autoscaler. Requires CPU/memory requests to be
  # set under `resources` for the targeted metrics to work. When enabled,
  # `replicaCount` is ignored (the HPA manages the replica count).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    # -- Target average CPU utilization (% of requests). Set to null to disable.
    targetCPUUtilizationPercentage: 80
    # -- Target average memory utilization (% of requests). Set to null to disable.
    targetMemoryUtilizationPercentage: 80
  serviceAccount:
    # -- Create a service account for this deployment's pods
    create: false
    # -- Service account name to use; if empty and `create` is true a name is generated
    name: ""
    # -- Annotations to add to the created service account (e.g. for workload identity)
    annotations: {}
  # -- Pod tolerations for the queue deployment (overrides `global.tolerations`)
  tolerations: []
  # -- Pod affinity rules for the queue deployment (overrides `global.affinity`)
  affinity: {}
  # -- Annotations added to the queue deployment's metadata (merged with `global.annotations`; per-service keys take precedence)
  annotations: {}
  # -- Pod volumes to mount into the deployment (list of Kubernetes volume specs)
  volumes: []
  # -- Container volume mounts (list of Kubernetes volumeMount specs)
  volumeMounts: []

auth:
  # -- Generate with `openssl rand -hex 22`
  secretKey: ""
  # -- Generate with `openssl rand -hex 22`
  accessKey: ""
  # -- Use a pre-existing secret (must provide keys `SECRET_KEY` and `ACCESS_KEY`) instead of generating one. When set, `secretKey`/`accessKey` are ignored.
  existingSecret: ""
  accessTokenExpireMinutes: 10080
  accessCodeExpireMinutes: 10080
  lockoutMaxAttempts: 10

cloudflare:
  apiToken: ""
  accountId: ""
  # -- Use a pre-existing secret (must provide keys `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID`) instead of generating one. When set, `apiToken`/`accountId` are ignored.
  existingSecret: ""

rateLimits:
  windowMinutes: 1
  requestsPerMinute: 600
  chatCreatePerMinute: 600
  documentChunkCreatePerMinute: 600
  frontendEventsPerMinute: 600
  authLoginPerMinute: 15
  authRegisterPerMinute: 15
  authGooglePerMinute: 15
  authRequestCodePerMinute: 5
  authValidateCodePerMinute: 15
  authChangePasswordPerMinute: 5
  agentPerMinute: 20
  notebookCodeFeedbackPerMinute: 40
  documentUploadPerMinute: 60
  searchPerMinute: 60
  ingestTriggerPerMinute: 20
  toolsPerMinute: 60
  annotationPerMinute: 120
  debugPerMinute: 20
  workflowTestConditionPerMinute: 120
  configValidatePerMinute: 20
  adminMutationPerMinute: 40
  iamMutationPerMinute: 60
  apiTokenPerMinute: 30
  notificationStreamPerMinute: 10
  queryAssistPerMinute: 30
  queryExecutePerMinute: 120
  queryValidatePerMinute: 60
  auditPayloadPerMinute: 30
  operatorTestPerMinute: 60
  backfillRunPerMinute: 30
  # -- Per-user limit on opening the live-log tail
  liveLogStreamPerMinute: 10
  # -- Per-user limit on the browser log relay endpoint
  liveLogClientPerMinute: 30

# -- Identity and access management
iam:
  # -- Seconds a resolved IAM permission set is cached in-process
  permissionsCacheTTL: 60

model:
  geminiModelName: "gemini-3-flash-preview"
  httpTimeoutSeconds: 180
  # -- Output-token ceiling for the default Gemini provider
  geminiMaxOutputTokens: 16384
  # -- Gemini thinking budget: `LOW`, `MEDIUM`, or `HIGH`
  geminiThinkingLevel: "LOW"
  # -- Retries when a Gemini response comes back truncated
  geminiTruncationRetries: 1
  # -- Provider calls the model-service will have in flight at once
  maxConcurrentProviderCalls: 50
  # -- Agent attempts when no fallback chain is configured
  agentNoChainMaxAttempts: 4
  # -- Annotator attempts when no fallback chain is configured
  annotatorNoChainMaxAttempts: 8
  # -- Wall-clock budget for annotator retries, in seconds
  annotatorRetryBudgetSeconds: 420

api:
  replicaCount: 1
  image:
    name: api
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  # -- In-flight requests one API pod accepts before it starts shedding
  maxConcurrentRequests: 128
  # -- Seconds a request waits for capacity before it is rejected
  capacityWaitSeconds: 5.0
  # -- Threads serving blocking DB work off the event loop
  dbThreadpoolSize: 64
  # -- Deployment resoruce contraints (i.e. requests/limits)
  resources: {}
  # -- Pod tolerations (overrides `global.tolerations`)
  tolerations: []
  # -- Pod affinity rules (overrides `global.affinity`)
  affinity: {}
  # -- Annotations added to this workload's metadata (merged with `global.annotations`; per-service keys take precedence)
  annotations: {}
  url: ""
  # -- Optional horizontal pod autoscaler. Requires CPU/memory requests to be
  # set under `resources` for the targeted metrics to work. When enabled,
  # `replicaCount` is ignored (the HPA manages the replica count).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    # -- Target average CPU utilization (% of requests). Set to null to disable.
    targetCPUUtilizationPercentage: 80
    # -- Target average memory utilization (% of requests). Set to null to disable.
    targetMemoryUtilizationPercentage: 80
  serviceAccount:
    # -- Create a service account for this deployment's pods
    create: false
    # -- Service account name to use; if empty and `create` is true a name is generated
    name: ""
    # -- Annotations to add to the created service account (e.g. for workload identity)
    annotations: {}
  # -- Pod volumes to mount into the deployment (list of Kubernetes volume specs)
  volumes: []
  # -- Container volume mounts (list of Kubernetes volumeMount specs)
  volumeMounts: []

