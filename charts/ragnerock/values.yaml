nameOverride: ~
fullnameOverride: ~

global:
  # -- Global container image configuration
  image:
    registry: us-central1-docker.pkg.dev/ragnerock-prod/ragnerock
    pullPolicy: IfNotPresent
    # -- Default image tag for all services. When empty, falls back to the chart's appVersion.
    tag: ""
  # -- Secrets use to authenticate with the container registry, list of `- name: <name of the secret>` values
  imagePullSecrets: []
  # -- Default pod tolerations applied to all workloads. Can be overridden per-service with `<service>.tolerations`. See https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []
  # -- Default pod affinity rules applied to all workloads. Can be overridden per-service with `<service>.affinity`. See https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}
  # -- Default annotations applied to the metadata of all workloads (Deployments/Job). Merged with per-service `<service>.annotations`, where per-service keys take precedence.
  annotations: {}
  # -- Number of replicaset revisions to keep around for deployments
  revisionHistoryLimit: 10

# -- Database configuration
database:
  host: ""
  port: 5432
  name: ragnerock
  user: ragnerock
  password: ""
  # -- Use a pre-existing secret (must provide key `DB_PASSWORD`) instead of generating one. When set, `password` is ignored.
  existingSecret: ""
  # -- Connections one API pod keeps open. The default is the figure the
  # §4.1 connection budget is computed from; `api.maxConcurrentRequests` is
  # sized against it and the chart refuses to render a gate that exceeds it
  poolSize: 12
  maxOverflow: 6
  poolTimeout: 10
  # -- Server-side connection ceiling, for the chart's own budget check. Empty
  # leaves the check off, which is right when the chart is installed against a
  # Postgres whose limit it cannot know. Set it and the chart refuses to render
  # a fleet whose worst-case pools exceed it.
  maxConnections: ""
  # -- Slots Postgres reserves for superusers and reserved roles, subtracted
  # from the budget above
  reservedConnections: 13
  # -- Slots held back for operators: psql, migrations, backups and any
  # per-tenant BYODB engines, which have no pool row of their own
  opsConnectionHeadroom: 27
  # -- Seconds every service waits to open a Postgres connection. Bounds how
  # long a host resolving to an unresponsive address (a DNS flap during a
  # failover) can stall startup or a request
  connectTimeoutSeconds: 5
  # -- Minimum seconds between two connection pool resets when Postgres
  # refuses writes as read-only, so a host still pointing at a standby does
  # not open a new connection per request
  readOnlyPoolResetIntervalSeconds: 5.0

# -- LLM authentication configuration
llm:
  gemini:
    apiKey: ""
  mistral:
    apiKey: ""
    # -- Retry policy for the Mistral OCR call. The SDK does not retry unless it
    # is handed a config, so without these a single 429 or 5xx from the OCR
    # endpoint fails the whole document job. Intervals are in milliseconds, the
    # unit the SDK's backoff strategy takes.
    retry:
      # -- First backoff interval before the OCR call is retried
      initialIntervalMS: 1000
      # -- Ceiling on the backoff interval. A `Retry-After` header on the
      # response wins over the computed backoff.
      maxIntervalMS: 60000
      # -- Growth factor applied to the backoff after each attempt
      exponent: 2.0
      # -- Total retry budget for one OCR call, matching the Document AI
      # backend's 10-minute deadline
      maxElapsedMS: 600000
  azure:
    apiKey: ""
    endpoint: ""
  textract:
    # -- AWS region the Textract API is called in. Required when `pdfParserBackend` is `textract`.
    region: ""
    # -- AWS access key ID. Required when `pdfParserBackend` is `textract`.
    accessKeyId: ""
    # -- AWS secret access key. Required when `pdfParserBackend` is `textract`.
    secretAccessKey: ""
    # -- Maximum concurrent Textract page requests per worker
    maxConcurrency: 4
    # -- Use a pre-existing secret (must provide key `AWS_SECRET_ACCESS_KEY`) instead of generating one. When set, `secretAccessKey` is ignored.
    existingSecret: ""

  # -- Use a pre-existing secret (must provide keys `GEMINI_API_KEY` and `MISTRAL_API_KEY`) instead of generating one. When set, `geminiApiKey`/`mistralApiKey` are ignored.
  existingSecret: ""
  # -- PDF parsing backend: `mistral`, `azure`, or `textract`
  pdfParserBackend: "mistral"
  # -- Extract embedded images from PDFs during parsing (for multimodal summarization)
  pdfExtractImages: true

encryption:
  # -- Key Encryption Key (KEK), generate with python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'
  kek: ""
  # -- Use a pre-existing secret (must provide key `ENCRYPTION_KEK`) instead of generating one. When set, `kek` is ignored.
  existingSecret: ""

gitops:
  # -- RSA private key (PEM) that opens GitOps secrets the GitHub action sealed for transport, generate with `task gitops-sealing-key`. Leave empty to run without transport sealing; the action then fails rather than uploading plaintext.
  sealingPrivateKey: ""
  # -- Use a pre-existing secret (must provide key `GITOPS_SEALING_PRIVATE_KEY`) instead of generating one. When set, `sealingPrivateKey` is ignored.
  existingSecret: ""
  # -- Largest manifest `POST /api/gitops/apply` accepts, in bytes
  maxManifestBytes: 5242880
  # -- Wall-clock budget for the code security review that runs after a GitOps apply, in seconds. Agents not reached in time are reported unreviewed.
  codeReviewBudgetSeconds: 60

# -- General app configuration
config:
  environmentIdentifier: ragnerock
  logLevel: INFO

ragnerock:
  # -- Should Ragnerock treat all prompts as unsafe
  safetyEnabled: true

# -- Otel metrics/traces/logs export
otel:
  enabled: false
  exporterEndpoint: ""
  exporterInsecure: false
  exporterProtocol: "http/protobuf"
  # -- Optional prefix for otel service names. E.g., setting servicePrefix to `foobar` changes api -> foobarapi
  servicePrefix: ""
  # -- OTEL service namespace
  serviceNamespace: "ragnerock"
  authHeader: ""
  # -- Use a pre-existing secret (must provide key `OTEL_EXPORTER_OTLP_HEADERS`) instead of generating one. When set, `authHeader` is ignored.
  existingSecret: ""

# -- Cloudtask configuration for use with in-cluster emulator
queue:
  jobQueueName: "ragnerock-document-jobs"
  subtaskQueueName: "ragnerock-subtask-jobs"
  callbackQueueName: "ragnerock-callbacks"
  auditQueueName: "ragnerock-audit"
  # -- Queue the audit-service enqueues its own /audit/export-run tasks onto
  auditExportQueueName: "audit-export-runs"
  queuePoolSize: 100
  port: 8123
  # -- Deployment resoruce contraints (i.e. requests/limits)
  resources: {}
  # -- Optional horizontal pod autoscaler. Requires CPU/memory requests to be
  # set under `resources` for the targeted metrics to work. When enabled,
  # `replicaCount` is ignored (the HPA manages the replica count).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    # -- Target average CPU utilization (% of requests). Set to null to disable.
    targetCPUUtilizationPercentage: 80
    # -- Target average memory utilization (% of requests). Set to null to disable.
    targetMemoryUtilizationPercentage: 80
  serviceAccount:
    # -- Create a service account for this deployment's pods
    create: false
    # -- Service account name to use; if empty and `create` is true a name is generated
    name: ""
    # -- Annotations to add to the created service account (e.g. for workload identity)
    annotations: {}
  # -- Pod tolerations for the queue deployment (overrides `global.tolerations`)
  tolerations: []
  # -- Pod affinity rules for the queue deployment (overrides `global.affinity`)
  affinity: {}
  # -- Annotations added to the queue deployment's metadata (merged with `global.annotations`; per-service keys take precedence)
  annotations: {}
  # -- Pod volumes to mount into the deployment (list of Kubernetes volume specs)
  volumes: []
  # -- Container volume mounts (list of Kubernetes volumeMount specs)
  volumeMounts: []

auth:
  # -- Generate with `openssl rand -hex 22`
  secretKey: ""
  # -- Generate with `openssl rand -hex 22`
  accessKey: ""
  # -- Use a pre-existing secret (must provide keys `SECRET_KEY` and `ACCESS_KEY`) instead of generating one. When set, `secretKey`/`accessKey` are ignored.
  existingSecret: ""
  accessTokenExpireMinutes: 10080
  accessCodeExpireMinutes: 10080
  lockoutMaxAttempts: 10

cloudflare:
  apiToken: ""
  accountId: ""
  # -- Use a pre-existing secret (must provide keys `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID`) instead of generating one. When set, `apiToken`/`accountId` are ignored.
  existingSecret: ""

rateLimits:
  windowMinutes: 1
  requestsPerMinute: 600
  chatCreatePerMinute: 600
  documentChunkCreatePerMinute: 600
  frontendEventsPerMinute: 600
  authLoginPerMinute: 15
  authRegisterPerMinute: 15
  authGooglePerMinute: 15
  authRequestCodePerMinute: 5
  authValidateCodePerMinute: 15
  authChangePasswordPerMinute: 5
  agentPerMinute: 20
  notebookCodeFeedbackPerMinute: 40
  notebookCompactionPerMinute: 10
  documentUploadPerMinute: 60
  searchPerMinute: 60
  ingestTriggerPerMinute: 20
  toolsPerMinute: 60
  # -- Agent-tool probes (REST route test, MCP discovery preview)
  agentToolProbesPerMinute: 30
  # -- Per-user limit on the admin page's search-provider Test button — an
  # admin-driven, BILLED query against the workspace's own key
  webSearchProbesPerMinute: 30
  annotationPerMinute: 120
  debugPerMinute: 20
  workbenchPerMinute: 10
  workflowTestConditionPerMinute: 120
  configValidatePerMinute: 20
  adminMutationPerMinute: 40
  iamMutationPerMinute: 60
  apiTokenPerMinute: 30
  notificationStreamPerMinute: 10
  queryAssistPerMinute: 30
  queryExecutePerMinute: 120
  queryValidatePerMinute: 60
  auditPayloadPerMinute: 30
  operatorTestPerMinute: 60
  # -- Per-user limit on workbench attachment parses. Each request can hold a synchronous worker OCR call for minutes, so the ceiling is deliberately low
  operatorParseSamplePerMinute: 10
  backfillRunPerMinute: 30
  # -- Per-user limit on opening the live-log tail
  liveLogStreamPerMinute: 10
  # -- Per-user limit on the browser log relay endpoint
  liveLogClientPerMinute: 30

# -- Identity and access management
iam:
  # -- Seconds a resolved IAM permission set is cached in-process
  permissionsCacheTTL: 60

model:
  geminiModelName: "gemini-3-flash-preview"
  httpTimeoutSeconds: 180
  # -- Output-token ceiling for the default Gemini provider
  geminiMaxOutputTokens: 16384
  # -- Gemini thinking budget: `LOW`, `MEDIUM`, or `HIGH`
  geminiThinkingLevel: "LOW"
  # -- Retries when a Gemini response comes back truncated
  geminiTruncationRetries: 1
  # -- Provider calls the model-service will have in flight at once
  maxConcurrentProviderCalls: 50
  # -- How long a request waits for a provider-call slot before the gate sheds
  # it with 503 + Retry-After
  providerCallWaitSeconds: 30
  # -- Retry-After sent on a provider-call shed
  providerCallRetryAfterSeconds: 5
  # -- Concurrent POSTs to model-service /annotate from one client process
  maxConcurrentAnnotateCalls: 50
  # -- Seconds a client-side /annotate call waits for one of those slots before
  # failing in-band. The failure is classified retryable, so reaching it costs a
  # redelivery rather than a failed row
  annotateWaitSeconds: 120
  # -- Annotation targets in flight at once across every subtask one worker
  # process is serving. The per-row limiters (web tools, agent tools, the
  # /annotate gate) are sized against this, not against
  # maxConcurrentSubtasks x maxConcurrentAnnotations
  maxConcurrentAnnotationTargets: 50
  # -- Agent attempts when no fallback chain is configured
  agentNoChainMaxAttempts: 4
  # -- Annotator attempts when no fallback chain is configured
  annotatorNoChainMaxAttempts: 8
  # -- Wall-clock budget for annotator retries, in seconds
  annotatorRetryBudgetSeconds: 420
  # -- Anthropic response-length ceiling (tokens); with thinking, max_tokens = thinking budget + this
  anthropicMaxOutputTokens: 8192
  # -- Anthropic thinking token budget for the LOW effort tier
  anthropicThinkingBudgetLow: 4096
  # -- Anthropic thinking token budget for the MEDIUM effort tier
  anthropicThinkingBudgetMedium: 8192
  # -- Anthropic thinking token budget for the HIGH effort tier
  anthropicThinkingBudgetHigh: 16384
  # -- Gemini thinking token budget for the LOW effort tier
  geminiThinkingBudgetLow: 1024
  # -- Gemini thinking token budget for the MEDIUM effort tier
  geminiThinkingBudgetMedium: 8192
  # -- Gemini thinking token budget for the HIGH effort tier
  geminiThinkingBudgetHigh: 24576
  # -- Route OpenAI calls through the Responses API (enables encrypted reasoning items)
  openaiUseResponsesApi: false

api:
  replicaCount: 1
  image:
    name: api
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  # -- In-flight ordinary requests one API pod accepts before it starts
  # shedding. Sized to `database.poolSize + maxOverflow`, because a request in
  # this class holds a connection for most of its life. On Kubernetes there is
  # no platform concurrency behind it, so this gate is the ONLY bound -- which
  # is why the chart checks it against the pool rather than trusting it
  maxConcurrentRequests: 18
  # -- Concurrent streaming requests (SSE, NDJSON, MCP waiters) one pod
  # admits. A separate class: a stream holds a request slot for minutes and a
  # DB connection for almost none of it, and every logged-in browser tab holds
  # two permanently
  maxConcurrentStreams: 40
  # -- Seconds a request waits for capacity before it is rejected
  capacityWaitSeconds: 5.0
  # -- Retry-After sent with a shed 503, honoured by the frontend's reconnect,
  # and with the 503 for a database connection lost to a failover
  capacityRetryAfterSeconds: 2
  # -- Concurrent HTTP connections to db-service, bounding the source so a
  # spike queues here rather than arriving as load db-service has to shed
  dbServiceMaxConnections: 40
  # -- Threads serving blocking DB work off the event loop
  dbThreadpoolSize: 64
  operatorSample:
    # -- Max workbench attachment size accepted by the parse-sample endpoint. The file rides to the worker as base64 JSON (~4/3 the size), so keep it at or below 20 MiB
    maxFileBytes: 20971520
    # -- API-side read timeout on the synchronous worker parse call, in seconds. Whole-document OCR of a large PDF via an external backend takes minutes
    parseTimeoutSeconds: 300
  # -- Deployment resoruce contraints (i.e. requests/limits)
  resources: {}
  # -- Pod tolerations (overrides `global.tolerations`)
  tolerations: []
  # -- Pod affinity rules (overrides `global.affinity`)
  affinity: {}
  # -- Annotations added to this workload's metadata (merged with `global.annotations`; per-service keys take precedence)
  annotations: {}
  url: ""
  # -- Optional horizontal pod autoscaler. Requires CPU/memory requests to be
  # set under `resources` for the targeted metrics to work. When enabled,
  # `replicaCount` is ignored (the HPA manages the replica count).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    # -- Target average CPU utilization (% of requests). Set to null to disable.
    targetCPUUtilizationPercentage: 80
    # -- Target average memory utilization (% of requests). Set to null to disable.
    targetMemoryUtilizationPercentage: 80
  serviceAccount:
    # -- Create a service account for this deployment's pods
    create: false
    # -- Service account name to use; if empty and `create` is true a name is generated
    name: ""
    # -- Annotations to add to the created service account (e.g. for workload identity)
    annotations: {}
  # -- Pod volumes to mount into the deployment (list of Kubernetes volume specs)
  volumes: []
  # -- Container volume mounts (list of Kubernetes volumeMount specs)
  volumeMounts: []

callbackDelivery:
  replicaCount: 1
  image:
    name: api
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  database:
    # -- Persistent DB connections held by the pool. SQLAlchemy's own default,
    # named explicitly so the connection budget sums a visible number
    poolSize: 5
    # -- Extra connections allowed beyond poolSize
    maxOverflow: 10
    # -- Seconds a request waits for a connection before failing
    poolTimeout: 5
    # -- Retry-After sent on the 503 that pool exhaustion produces. No admission
    # gate sits in front of this pool, so exhaustion is the overload path. Also
    # sent with the 503 for a database connection lost to a failover
    capacityRetryAfterSeconds: 2
  # -- Deployment resoruce contraints (i.e. requests/limits)
  resources: {}
  # -- Optional horizontal pod autoscaler. Requires CPU/memory requests to be
  # set under `resources` for the targeted metrics to work. When enabled,
