dbService:
  replicaCount: 1
  image:
    name: db-service
    # -- Overwrites global value if set
    tag: ""
  service:
    type: ClusterIP
    port: 8080
    # -- Maximum number of rows accepted in a single batch write
  batchLimit: 10000
  # -- Concurrent requests against the DEFAULT data DB one pod admits. Empty
  # derives it from the default pool's capacity, since every admitted request
  # can hold at most one of its connections
  maxConcurrentRequests: ""
  # -- Concurrent BYODB requests one pod admits. A separate class because a
  # customer query runs for seconds to minutes while internal traffic is
  # milliseconds; empty derives it from the conservative BYODB pool
  maxConcurrentExternalRequests: ""
  # -- Seconds a request waits for a capacity slot before being shed
  capacityWaitSeconds: 2.0
  # -- Retry-After sent with a shed, POOL_EXHAUSTED, or CONNECTION_FAILED 503
  capacityRetryAfterSeconds: 2
  # -- Seconds a request waits for a DB connection before the app returns 503
  # POOL_EXHAUSTED. At least capacityWaitSeconds, so the gate sheds first
  poolTimeout: 5
  # -- Seconds before the first retry when the default data DB is unreachable or
  # read-only at startup. The pod stays up and unready while it retries
  defaultDBStartupRetryInitialSeconds: 1.0
  # -- Cap on the doubling delay between those startup retries (seconds)
  defaultDBStartupRetryMaxSeconds: 30.0
  # -- Per-customer-DB rate limit: token bucket capacity (the default data DB is exempt)
  rateLimitMaxTokens: 100
  # -- Per-customer-DB rate limit: token refill rate (tokens per second)
  rateLimitRefillRate: 20.0
  # -- Consecutive connection failures before a config is flagged for deactivation
  connectionFailureThreshold: 5
  # -- Connection pool size for a customer database that does not specify one
  defaultDBPoolSize: 20
  # -- Overflow above the pool size for a customer database that does not specify one
  defaultDBMaxOverflow: 20
  # -- Threads serving blocking driver work off the event loop
  requestThreadpoolSize: 80
  # -- Ceiling for every statement on a Snowflake BYODB connection (seconds); Snowflake's own default is two days
  snowflakeStatementTimeoutSeconds: 600
  # -- How long a Snowflake statement waits for a table lock (seconds); kept under the worker's 60 s write budget
  snowflakeLockTimeoutSeconds: 30
  # -- Rows per multi-row INSERT when SQLAlchemy pages an executemany batch on Snowflake
  snowflakeInsertPageSize: 1000
  # -- Deployment resoruce contraints (i.e. requests/limits)
  resources: {}
  # -- Optional horizontal pod autoscaler. Requires CPU/memory requests to be
  # set under `resources` for the targeted metrics to work. When enabled,
  # `replicaCount` is ignored (the HPA manages the replica count).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    # -- Target average CPU utilization (% of requests). Set to null to disable.
    targetCPUUtilizationPercentage: 80
    # -- Target average memory utilization (% of requests). Set to null to disable.
    targetMemoryUtilizationPercentage: 80
  # -- Pod disruption budget, on by default because every other service calls
  # db-service synchronously. Set exactly one of `minAvailable`/`maxUnavailable`;
  # the other must be null. Both accept an integer or a percentage string (e.g.
  # `"50%"`). The default `maxUnavailable: 1` never blocks a node drain, so it
  # only keeps db-service up through one when `replicaCount` is 2 or more.
  podDisruptionBudget:
    enabled: true
    minAvailable: null
    maxUnavailable: 1
  serviceAccount:
    # -- Create a service account for this deployment's pods
    create: false
    # -- Service account name to use; if empty and `create` is true a name is generated
    name: ""
    # -- Annotations to add to the created service account (e.g. for workload identity)
    annotations: {}
  # -- Pod volumes to mount into the deployment (list of Kubernetes volume specs)
  volumes: []
  # -- Container volume mounts (list of Kubernetes volumeMount specs)
  volumeMounts: []
  # -- Pod tolerations (overrides `global.tolerations`)
  tolerations: []
  # -- Pod affinity rules (overrides `global.affinity`)
  affinity: {}
  # -- Annotations added to this workload's metadata (merged with `global.annotations`; per-service keys take precedence)
  annotations: {}

dataIngestor:
  replicaCount: 1
  image:
    name: data-ingestor
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  # -- Deployment resoruce contraints (i.e. requests/limits)
  resources: {}
  # -- Optional horizontal pod autoscaler. Requires CPU/memory requests to be
  # set under `resources` for the targeted metrics to work. When enabled,
  # `replicaCount` is ignored (the HPA manages the replica count).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    # -- Target average CPU utilization (% of requests). Set to null to disable.
    targetCPUUtilizationPercentage: 80
    # -- Target average memory utilization (% of requests). Set to null to disable.
    targetMemoryUtilizationPercentage: 80
  serviceAccount:
    # -- Create a service account for this deployment's pods
    create: false
    # -- Service account name to use; if empty and `create` is true a name is generated
    name: ""
    # -- Annotations to add to the created service account (e.g. for workload identity)
    annotations: {}
  # -- Pod volumes to mount into the deployment (list of Kubernetes volume specs)
  volumes: []
  # -- Container volume mounts (list of Kubernetes volumeMount specs)
  volumeMounts: []
  # -- Pod tolerations (overrides `global.tolerations`)
  tolerations: []
  # -- Pod affinity rules (overrides `global.affinity`)
  affinity: {}
  # -- Annotations added to this workload's metadata (merged with `global.annotations`; per-service keys take precedence)
  annotations: {}

migrations:
  image:
    name: migrations
    tag: ""
  # -- Deployment resoruce contraints (i.e. requests/limits)
  resources: {}
  serviceAccount:
    # -- Create a service account for the migrations job's pods
    create: false
    # -- Service account name to use; if empty and `create` is true a name is generated
    name: ""
    # -- Annotations to add to the created service account (e.g. for workload identity)
    annotations: {}
  # -- Pod tolerations (overrides `global.tolerations`)
  tolerations: []
  # -- Pod affinity rules (overrides `global.affinity`)
  affinity: {}
  # -- Annotations added to this workload's metadata (merged with `global.annotations`; per-service keys take precedence)
  annotations: {}

# Periodic maintenance, fired in-cluster. On GCP these routes are driven by
# Cloud Scheduler; a self-hosted install has no equivalent, so without this
# neither compat execution history nor uncollected ephemeral results are ever
# cleaned up.
maintenance:
  # -- Run the maintenance CronJob. Disable only if you fire the internal
  # `/api/endpoints/internal/*` routes some other way.
  #
  # The job sends no credential. Those routes are guarded by a Google OIDC
  # check that a Kubernetes CronJob cannot satisfy, and that check is inert
  # unless `CALLBACK_AUTH_ENABLED` is true — which this chart never sets. In
  # other words they are protected by network isolation: reachable only from
  # inside the cluster, and the chart ships no ingress. If you turn
  # `CALLBACK_AUTH_ENABLED` on through `api.extraEnv`, this job starts
  # failing every night; disable it here and drive the two routes yourself.
  enabled: true
  # -- Cron schedule (cluster timezone). Daily, off-peak by default.
  schedule: "23 3 * * *"
  image:
    name: api
    tag: ""
  # -- Per-route HTTP timeout. The prune route works in bounded batches and
  # resumes at the next firing, so it never needs a long one.
  timeoutSeconds: 300
  # -- Retries within one firing. The routes are idempotent and daily, so a
  # transient failure is better left to tomorrow's run than retried hard.
  backoffLimit: 1
  # -- Skip a firing that could not start within this many seconds rather
  # than piling up missed runs after a cluster outage.
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # -- Deployment resource constraints (i.e. requests/limits)
  resources: {}
  serviceAccount:
    # -- Create a service account for the maintenance job's pods
    create: false
    # -- Service account name to use; if empty and `create` is true a name is generated
    name: ""
    # -- Annotations to add to the created service account (e.g. for workload identity)
    annotations: {}
  # -- Pod tolerations (overrides `global.tolerations`)
  tolerations: []
  # -- Pod affinity rules (overrides `global.affinity`)
  affinity: {}
  # -- Annotations added to this workload's metadata (merged with `global.annotations`; per-service keys take precedence)
  annotations: {}

limits:
  # -- Ids per request to a db-service '*-by-ids' endpoint, and the ceiling
  # those endpoints enforce -- one value, because the client's chunk size and
  # the server's limit are one decision. A URL byte budget: each id costs 41
  # bytes of request line, so 200 is about 8.2 KB, half the smallest limit in
  # the path.
  dbIdsPerRequest: 200
  concurrency:
    maxConcurrentSubtasks: 50
    maxConcurrentAnnotations: 10
    maxConcurrentJobs: 10
    # -- Concurrent workbench attachment parses one worker pod accepts. These are synchronous API-originated calls sharing the pod with queue deliveries, so the pool is small; excess requests shed as 503
    maxConcurrentSampleParses: 2
  usage:
    maxInputTokens: "1000000"
    maxOutputTokens: "1000000"
    maxPages: "2000"
    maxComputeSeconds: "86400"
  batches:
    embedding: 100
    annotation: 50
    # -- Items per annotation subtask when the operator carries tools
    toolOperatorSubtask: 10
    # -- Size ROW subtasks from settings rather than from the operator's
    # batch_size (which is rows per LLM call, not rows per subtask)
    rowSubtaskGrainEnabled: true
    # -- Ceiling on the elapsed user-tool time one subtask may spend
    subtaskToolElapsedCeilingSeconds: 900
  subtask:
    maxAttempts: 3
    failureThreshold: 0.05
    # -- Minutes without a heartbeat before an in-flight subtask may be re-claimed
    staleThresholdMinutes: 35
  job:
    # -- Extra delay past the subtask stale threshold before the job watchdog reconciles
    watchdogSlackMinutes: 5
  # -- Largest upstream row count an LLM aggregation node may drain into one request
  aggregationMaxUpstreamRows: 10000
  codeOperator:
    # -- Wall-clock ceiling for a code operator's execution, in seconds
    timeoutSeconds: 30
    # -- Largest time limit an element-scope (Row/Page/Paragraph/Sentence) code operator may declare, in seconds
    maxTimeoutSeconds: 30
    # -- Largest time limit a Sheet- or Document-scope code operator may declare, in seconds
    maxTimeoutSecondsSheet: 300

# -- Ragnerock provided license key
license: ""
# -- Use a pre-existing secret (must provide key `RAGNEROCK_LICENSE`) instead of generating one. When set, `license` is ignored.
licenseExistingSecret: ""
# -- License server the deployment validates against
licenseServerUrl: "https://licenses.ragnerock.com"

# Periodic license re-validation. Every licensed service validates once at
# startup and then re-validates on this schedule, stopping the process when the
# license is refused. See docs/design-docs/periodic-license-checks.md.
licenseCheck:
  # -- Enable license enforcement. Turning this off skips both the startup check and the periodic re-check; intended for air-gapped evaluation, not for production.
  enabled: true
  # -- Seconds between checks after a successful validation (default: once a day)
  intervalSeconds: 86400
  # -- Seconds between checks while the license server is unreachable
  retrySeconds: 3600
  # -- How long a service may keep serving without a successful validation before it stops (default: 3 days)
  graceSeconds: 259200
  # -- Per-request timeout for one validation call, in seconds
  timeoutSeconds: 10
  # -- Seconds allowed for graceful shutdown after a lapsed license before the process is killed
  shutdownGraceSeconds: 30

endpoints:
  HMACMasterKey: ""
  # -- Use a pre-existing secret (must provide key `ENDPOINTS_HMAC_MASTER_KEY`) instead of generating one. When set, `HMACMasterKey` is ignored.
  existingSecret: ""
  allowPrivateCallbacks: true
  ephemeralTTLHours: 24
  maxFileSizeMB: 50
  # -- Request body ceiling for the OpenAI/Anthropic/Gemini-compatible endpoints, in bytes
  compatMaxBodyBytes: 10485760
  # -- Wall-clock ceiling for one compatibility-endpoint call, in seconds
  compatTimeoutSeconds: 300
  # -- Days an endpoint execution record is kept before it is pruned
  executionRetentionDays: 90
  # -- Execution records deleted per prune statement
  executionPruneBatchSize: 5000
  # -- Prune statements issued in one pass before the job yields
  executionPruneMaxBatches: 100
  # The MCP front every workflow endpoint publishes. The wait and result
  # limits below are quoted verbatim in the tool contract agents read, so
  # changing one changes a contract that is already in use.
  mcp:
    # -- Serve the MCP front on workflow endpoints. When false the route answers 404
    enabled: true
    # -- Wait budget, in seconds, for a call that omits `wait_seconds`. Under the TypeScript MCP SDK's absolute 60 s request timeout
    defaultWaitSeconds: 55
    # -- Ceiling, in seconds, on a call's `wait_seconds`, measured from request arrival
    maxWaitSeconds: 240
    # -- Elapsed seconds past which the tool contract tells an agent to stop polling a run and report it stuck
    staleHintSeconds: 3600
    # -- Serialized-envelope size, in bytes, above which a result is reduced to its document-scoped fields
    resultMaxBytes: 98304
    # -- Offer and accept URL file inputs. Advertised in the published tool contract only when on
    allowUrlInputs: true
    # -- Wall-clock budget, in seconds, shared by every URL input of one call
    urlFetchBudgetSeconds: 30
    # -- Connect timeout, in seconds, for one URL file input; short so an unreachable host fails fast instead of eating the fetch budget
    urlConnectTimeoutSeconds: 5
    # -- Let a URL input resolve to a private address or use plain http. Not the callback switch: a URL input hands the fetched bytes back through the workflow's output
    allowPrivateUrlInputs: false
    # -- How often, in seconds, a waiting call re-reads the execution row
    pollSeconds: 2
    # -- Idle seconds between keepalives on a waiting stream. Under Cloudflare's 100 s ceiling on a silent origin
    keepaliveSeconds: 15
    # -- JSON-RPC request-body ceiling, in bytes. Bounds base64 file inputs
    maxBodyBytes: 16777216
    # -- Concurrent waiting calls one API instance will hold before answering `processing` immediately. Keep at or below half of `api.maxConcurrentStreams`: every logged-in browser tab holds two stream slots
    maxWaiters: 16

ingest:
  staleTimeoutSeconds: 3600

analysis:
  dataframeOpTimeout: 60
  maxColumns: 500
  maxRows: 50000
  modelFitTimeoutSeconds: 120
  plotDPI: 150
  plotMaxFigsize: 
    dimx: 12.0
    dimy: 16.0
  plotTimeoutSeconds: 60

agent:
  maxIterations: 10
  # -- Tool-call iterations an annotation operator's agent may take before it is cut off
  annotationToolMaxIterations: 25
  # -- Turn token budget in cost-weighted units (output + uncached input + cachedTokenWeight x cached input). Empty disables budget termination, leaving the iteration cap as the only backstop
  turnTokenBudget: 150000
  # -- Soft advisory threshold: at this fraction of the turn budget the Runner injects one non-forcing wrap-up message
  tokenBudgetSoftFraction: 0.8
  # -- Weight of a cache-read input token in the cost-weighted budget unit
  cachedTokenWeight: 0.1
  # -- A sub-runner's spend ceiling as a share of the parent turn's remaining budget at spawn
  subAgentBudgetFraction: 0.5
  # -- Ops kill switch for reasoning/thinking: when false the API never sets a reasoning effort
  reasoningEnabled: true
  # -- Rollout flag for parallel tool-call draining: when true the Runner executes the whole tool-call batch before re-invoking
  drainToolCalls: false
  # -- In-turn context-eviction trigger (previous call's input tokens). Empty disables eviction; intended production value 140000
  contextEvictionHighWaterTokens: ""
  # -- Context-eviction pass target, in tokens
  contextEvictionLowWaterTokens: 90000
  # -- Smallest tool-result content (chars) worth stubbing during eviction
  contextEvictionMinChars: 2000
  # -- Rollout flag: attach sandbox plots to tool results so the model sees them within the producing turn
  toolResultImages: false

tools:
  codeToolTimeoutSeconds: 30
  # -- Cap on images attached to a single agent tool result
  maxResultImages: 10

# -- Notebook agent rollout flags and the compaction-call timeout.
notebook:
  # -- Rollout flag: persist a real CODE cell for each sandbox execution so the UI and next turn's history see sandbox runs like kernel runs
  sandboxCodeCells: false
  # -- Rollout flag: capture a full history snapshot on the first iteration of every notebook turn so the audit record is exactly replayable
  auditTurnSnapshot: false
  # -- Wall-clock bound (seconds) on the one-shot notebook-compaction summarization call
  compactionTimeoutSeconds: 120

# -- Agentic memory: the ops kill switch, schema-proliferation caps, and the
# per-run write budgets that bound a single agent's memory writes.
memory:
  # -- Expose the memory tools to agents. Set to false to switch memory off entirely.
  toolsEnabled: true
  # -- Schemas per project past which creating another is discouraged
  schemaSoftCap: 25
  # -- Schemas per project past which creating another is refused
  schemaHardCap: 100
  # -- Memory writes allowed in a single annotation run
  writeBudgetAnnotation: 12
  # -- Memory writes allowed in a single notebook turn
  writeBudgetNotebook: 8
  # -- Memory searches allowed in a single annotation run
  searchBudgetAnnotation: 8

# -- Agent message board: the ops switch (independent of memory.toolsEnabled),
# the message body cap, and the bounds on the inbox listing and the write budget.
messageBoard:
  # -- Expose the message board's tools to agents in projects that switch it on.
  enabled: true
  # -- Characters allowed in a message body; longer posts are rejected
  maxBodyChars: 1000
  # -- Entries in one inbox listing; also the read/archive budget per invocation
  inboxMaxEntries: 10
  # -- Agent handles named before collapsing into "(and N more)"
  maxHandles: 20
  # -- Days after which a message is no longer listed for anyone
  inboxMaxAgeDays: 30
  # -- message_write calls allowed in a single agent invocation
  writeBudget: 4

# -- Agent skills: the ops kill switch, the size caps that bound catalog and
# body token cost, and the per-run load budget.
skills:
  # -- Serve skills to agents. Set to false to switch skills off entirely.
  enabled: true
  # -- Maximum instruction-body length in characters
  bodyMaxChars: 32000
  # -- Maximum description length in characters (bounds catalog token cost)
  descriptionMaxChars: 512
  # -- Skills a single workflow agent may select
  maxPerOperator: 10
  # -- load_skill calls allowed in a single run
  loadMaxCalls: 10

# -- Web access: the ops kill switch plus the egress, size, and budget bounds
# for the web_search and web_fetch tools agents reach the open web with.
webTools:
  # Both tools dial the open web directly and pin every connection to an
  # address they checked; they do not honour HTTPS_PROXY and cannot run
  # behind an HTTP proxy. A cluster that reaches the internet only through
  # one should leave `enabled` false.
  # -- Serve the web_search and web_fetch tools. Set to false to build neither
  # anywhere, resolve every account to no web access, and refuse the
  # configuration API.
  enabled: true
  # -- Comma-separated hostnames, hostname suffixes (".corp.internal"), or CIDRs
  # a MODEL-CHOSEN url may reach even though they resolve to private addresses,
  # and which are exempt from the public-port rule. Empty means public only.
  # Deliberately separate from `agentTools.privateEgressAllowlist`: that list is
  # for URLs an editor typed, this one for URLs a search result suggested.
  privateEgressAllowlist: ""
  # -- Extra hostnames, hostname suffixes, or CIDRs web_fetch may never reach,
  # on top of this release's own Service names (seeded automatically). List the
  # deployment's public hostnames and any service that trusts this cluster's
  # egress address without a credential.
  fetchBlocklistExtra: []
  # -- Accept plain http://. When false, http:// URLs are upgraded to https:// on
  # the initial URL and every redirect hop, and public targets may use port 443 only.
  fetchAllowHttp: false
  # -- Honor robots.txt allow and disallow rules per RFC 9309. Turn off only for
  # intranets whose blanket Disallow targets public crawlers.
  fetchRespectRobots: true
  # -- In-flight fetches per process per dialled host, page and robots alike
  fetchMaxConcurrentPerHost: 2
  # -- Redirect hops followed, each re-validated and re-pinned
  fetchMaxRedirects: 5
  # -- Decoded read cap for HTML, text, and JSON responses
  fetchMaxBytes: 5242880
  # -- Read cap for PDFs, which are read whole into memory
  fetchPdfMaxBytes: 33554432
  # -- In-flight PDF downloads per process; times `fetchPdfMaxBytes` is the
  # memory worst case the API and worker limits must cover
  fetchMaxConcurrentPdf: 2
  # -- Pages of text layer extracted from one PDF
  fetchPdfMaxPages: 50
  # -- Markdown handed to the model per fetch call; it pages past this
  fetchResultMaxChars: 32000
  # -- Wall clock for one fetch, extraction included
  fetchTimeoutSeconds: 45
  # -- Timeout for one robots.txt request
  fetchRobotsTimeoutSeconds: 5
  # -- Process-level TTL for parsed and 4xx robots verdicts
  fetchRobotsCacheTtlSeconds: 3600
  # -- Threads in the dedicated extraction executor
  fetchExtractThreads: 2
  # -- Per-process limiter for all web calls, separate from
  # `agentTools.maxConcurrentCalls`; also sizes the web client's connection pool
  maxConcurrentCalls: 10
  # -- Pages held in the per-build web cache
  cacheMaxEntries: 64
  # -- Bytes held in the per-build web cache
  cacheMaxBytes: 16777216
  # -- User-Agent the web tools send. Its product token is what robots.txt is
  # matched against, and the URL must resolve to a page describing the bot.
  userAgent: "RagnerockBot/1 (+https://ragnerock.com/bot)"
  # -- Cap on the agent-visible text carried in a web tool's audit payload
  auditResultMaxChars: 8000
  # -- Search results returned when the model names no count
  searchDefaultResults: 10
  # -- Ceiling a model-supplied result count is clamped to
  searchMaxResults: 20
  # -- Wall clock for one search call, retries included
  searchTimeoutSeconds: 15
  # -- Searches an operator may make per target document
  searchMaxCallsPerInvocation: 3
  # -- Searches the notebook agent may make in one turn
  searchMaxCallsPerTurn: 5
  # -- Default billed searches per account per rolling day; an account
  # administrator can override it per workspace
  searchAccountDailyCap: 5000
  # -- Retries on a 429 or 503 from the search provider, honoring Retry-After
  searchRetryAttempts: 2
  # -- Where the Brave adapter sends its query. Point it at a vendor proxy if
  # this cluster reaches the provider through one; changing it changes where
  # each workspace's search key is sent
  searchBraveUrl: "https://api.search.brave.com/res/v1/web/search"

# -- Agent tools: the ops kill switch plus the size, time, and concurrency
# bounds for the MCP servers and REST APIs a project points its agents at.
agentTools:
  # -- Serve user-defined agent tools. Set to false to build no MCP or REST tools
  # anywhere and ignore the system-tool rows (a full revert to the built-in list).
  enabled: true
  # -- Comma-separated hostnames, hostname suffixes (".corp.internal"), or CIDRs
  # a tool may target even though they resolve to private addresses, and for
  # which http:// is accepted. Empty means public HTTPS only. Name hosts rather
  # than ranges: every service on an allowlisted host becomes reachable.
  privateEgressAllowlist: ""
  # -- MCP + REST tools a single project may define
  maxUserToolsPerProject: 25
  # -- Tools a single workflow agent may select
  maxPerOperator: 10
  # -- Expanded tool functions one consumer may carry (the notebook, or one agent)
  maxFunctionsPerAgent: 40
  # -- Routes a single REST tool may declare
  restMaxRoutes: 30
  # -- Discovered functions kept per MCP server
  mcpMaxFunctions: 30
  # -- Request headers configurable on one tool
  maxHeaders: 20
  # -- Maximum header value length in characters (a JWT fits)
  headerValueMaxChars: 4096
  # -- Maximum function description length (it rides every prompt)
  descriptionMaxChars: 1024
  # -- Maximum per-parameter description length
  paramDescriptionMaxChars: 256
  # -- Maximum serialized size of one function's parameter schema
  schemaMaxBytes: 16384
  # -- Maximum nesting depth of one function's parameter schema
  schemaMaxDepth: 5
  # -- Per-call wall clock when the route or server sets none
  callTimeoutSeconds: 30
  # -- Cap on a per-route or per-server timeout override
  callTimeoutMaxSeconds: 120
  # -- Total tool wall clock per subtask or notebook turn
  buildTimeBudgetSeconds: 600
  # -- Each row's carve-out of its subtask's tool wall clock; a row that
  # exhausts it fails rather than answering without its tools
  rowTimeBudgetSeconds: 360
  # -- How long a call waits for the concurrency semaphore before failing in-band
  busyWaitSeconds: 5
  # -- Connect timeout, so unreachable hosts fail fast
  connectTimeoutSeconds: 5
  # -- Timeout for an MCP tools/list call at save or refresh
  discoveryTimeoutSeconds: 20
  # -- Streamed read cap, counted in decoded bytes
  responseMaxBytes: 262144
  # -- Result text handed to the model, in characters
  resultMaxChars: 32000
  # -- Maximum request body, bounding argument egress
  requestBodyMaxBytes: 262144
  # -- Default per-invocation call budget on every tool function
  maxCallsPerInvocation: 10
  # -- Per-process concurrency semaphore and egress pool size
  maxConcurrentCalls: 20
  # -- MCP image blocks attached to a notebook tool result
  maxResultImages: 4
  # -- Cap on the result text carried in an external-tool audit payload
  auditResultMaxChars: 8000
  # -- Cap on a stored annotation tool-call result (provenance, not replay)
  annotationToolCallRecordResultMaxChars: 40000
  # -- Record every MCP/REST call an agent makes as a row of the tool's
  # tool_<slug> table in the customer's data DB (the audit trail is unaffected)
  executionLogEnabled: true
  # -- Ceiling on one execution-log write; past it the row is dropped with a warning
  executionLogWriteTimeoutSeconds: 5

# -- Node decorators (JUDGE/CHECK/CRITIC/TOKEN_BUDGET): the global kill switch
# and the bounds that keep a decorated node's per-item cost bounded.
decorators:
  # -- Serve node decorators. Set to false to reject decorator writes and fail
  # decorated items rather than silently running the bare operator.
  enabled: true
  # -- Decorator specs allowed on a single node
  maxPerNode: 4
  # -- Upper bound on a judge's runs
  judgeMaxRuns: 5
  # -- Upper bound on a check/critic's retry attempts
  checkMaxAttempts: 5
  # -- Ceiling on base-operator calls one decorated invocation may make
  maxLeafCalls: 30
  # -- Ceiling on a rendered judge candidate / critic output, in characters
  renderMaxChars: 20000
  # -- python-service timeout for a check's code, in seconds
  checkTimeoutSeconds: 30

# -- Tabular documents: page sizes for reads and the shape of the table
# summaries rendered into prompts.
tabular:
  # -- Rows returned per page when an agent lists a tabular document
  listPageSize: 20
  # -- Columns of a table described in a prompt
  promptMaxColumns: 20
  # -- Tables described in a single prompt
  promptMaxSources: 10
  # -- Rows returned per page when an agent reads a tabular document
  readRowsPerPage: 50

# -- BYOAI fallback chains: how far a chain may reach and how long the
# model-service will spend working through one.
fallback:
  # -- Fallback hops allowed after the primary provider
  maxDepth: 3
  # -- Ceiling on the summed ciphertext of a chain's fallback leaves, in bytes
  maxChainCiphertextBytes: 30720
  # -- Wall-clock budget for one annotation chain, in seconds
  chainBudgetSeconds: 420
  # -- Wall-clock budget for one agent chain, in seconds
  agentChainBudgetSeconds: 120
  # -- Attempts against each provider in a chain before moving to the next
  perProviderAttempts: 2

# -- Workflow resources bound into operator runs and rendered into prompts.
workflowResources:
  # -- Ceiling on a value resource's serialized inline value, in bytes
  valueMaxBytes: 262144
  # -- Ceiling on the resource context rendered into one prompt, in characters
  contextMaxChars: 200000
  # -- Ceiling on a single code operator's returned resource, in bytes
  codeMaxBytes: 20000000
  # -- Ceiling on the rows a single code operator may return
  codeMaxRows: 100000
  # -- Ceiling on all code operator resources for one run, in bytes
  codeTotalMaxBytes: 40000000
  # -- Byte budget for the worker's per-process cache of materialized code resources
  codeCacheMaxBytes: 256000000

workbench:
  # -- Kill switch for the workbench auto-iterate loop. Disabled, the chat and
  # try-it-out surfaces keep working; only the autonomous loop is refused.
  autoEnabled: true
  # -- Runner backstop: max agent-loop iterations for one auto session
  autoMaxIterations: 40
  # -- Max apply/run tool calls per workbench auto session
  autoMaxCycles: 5
  # -- Cost-weighted token budget for one workbench auto session. Charged the
  # run's real model spend, not just agent-side tokens.
  autoTokenBudget: 300000
  # -- Clamp on the per-run target count in workbench auto mode
  autoMaxTargets: 5
  # -- Per-node cap when condensing a workbench run's debug steps for the agent, in characters
  runResultMaxCharsPerNode: 4000
  # -- How many workbench restore points to keep per workflow
  snapshotRetention: 10
  # -- How many DebugSessions to keep per (workflow, user)
  debugSessionRetention: 20

# -- Settings shared by the worker and subtask-worker deployments. Both run the
# same job-processing code, so they are tuned together.
workers:
  # -- Seconds a task waits for local capacity before it is deferred
  capacityWaitSeconds: 5.0
  # -- Retry-After sent with a shed, pool-exhausted, or lost-connection 503; the queue honours
  # it as backoff, so a saturated instance gets a delayed redelivery rather
  # than an immediate one that finds it just as full
  capacityRetryAfterSeconds: 5
  # -- Concurrent HTTP connections to db-service, bounding the source
  dbServiceMaxConnections: 40
  # -- Requests one pod is allowed to serve at once, as configured on the
  # platform. Caps the derived DB pool at what can actually arrive; empty
  # leaves the derivation to the concurrency semaphores alone
  maxInstanceRequestConcurrency: ""
  # -- Threads serving blocking DB work off the event loop
  dbThreadpoolSize: 80
  # -- Concurrent job phase-advances a worker process may run
  maxConcurrentJobAdvances: 10
  # -- Concurrent spawn continuations a worker process may run. A node whose
  # subtasks take longer than `spawn.timeBudgetSeconds` to publish continues on
  # a later delivery; those get their own pool so one large job's paging cannot
  # queue behind every other job's phase advances.
  maxConcurrentSpawns: 5
  # -- Characters per chunk when a document is split for embedding
  maxChunkChars: 6000
  # -- Concurrent Cloud Tasks publishes during a subtask spawn
  subtaskPublishConcurrency: 32
  # -- Minutes after a subtask's publish past which reconciliation republishes it
  subtaskEnqueueStaleMinutes: 15
  # -- Subtask rows per multi-row INSERT when a plan is persisted. The plan
  # still commits in one transaction; this bounds each statement in it.
  subtaskInsertChunkRows: 5000
  spawn:
    # -- Subtasks published per page of a spawn
    pageSize: 1000
    # -- Wall clock one spawn delivery may spend publishing before handing the
    # rest to a continuation. Must stay well under the queue's dispatch
    # deadline, or the delivery is killed mid-page instead of stopping cleanly.
    timeBudgetSeconds: 300
    # -- Seconds a claimed-but-unfinished plan may sit before another delivery
    # takes it over, so a planner that died cannot hang the node forever
    planningStaleSeconds: 900
  tabularIngest:
    # -- Rows per db-service insert request when ingesting a tabular document
    rowInsertChunkRows: 1000
    # -- Byte ceiling per tabular row-insert request (binds first on a wide sheet)
    rowInsertChunkBytes: 8000000
    # -- Tabular row references per enumeration page (db-service caps it at 10,000)
    rowRefsPageSize: 10000
    # -- Rows a single parsed sheet may hold before the parse fails explicitly
    maxRowsPerSheet: 100000
  database:
    # -- Seconds a statement waits on a row lock before erroring
    lockTimeoutSeconds: 30
    # -- Milliseconds a subtask completion may wait on the job row's lock before warning
    completionLockSlowMs: 1000
    # -- Seconds a checkout waits for a free pooled connection
    poolTimeout: 10
    # -- Connections kept spare on top of the derived pool size, for non-request work
    poolHeadroom: 5
    # -- Explicit connection pool size. Derived from the concurrency limits plus
    # `poolHeadroom` when null, mirroring the worker's own in-process derivation.
    poolSize: ~
    # -- The SUBTASK worker's own pool size, when it should differ from the
    # plain worker's. Both deployments run one image and share this ConfigMap,
    # but not the work: at concurrency 1 the plain worker never serves a
    # subtask, so a pool sized for `maxConcurrentSubtasks` is one it holds open
    # for nothing. Null falls back to `poolSize`.
    subtaskPoolSize: ~
    # -- The subtask worker's own overflow; null falls back to `maxOverflow`.
    subtaskMaxOverflow: ~
    # -- Explicit overflow above the pool size. Falls back to `poolHeadroom` when null.
    maxOverflow: ~
  # -- Periodic DB sweep that re-enqueues jobs whose queue deliveries were
  # dropped after exhausting their retry budget.
  reconcile:
    # -- Run the reconciliation sweep
    enabled: true
    # -- Seconds between sweeps
    intervalSeconds: 300
    # -- Jobs examined per sweep
    batchSize: 100
    # -- Seconds a job may sit unstarted before the sweep re-enqueues it
    notStartedAfterSeconds: 900
    # -- Seconds a job may sit in progress before the sweep re-enqueues it
    inProgressAfterSeconds: 2700

audit:
  batchMaxBytes: 819200 # 800 * 1024
  batchMaxEvents: 50
  drainTimeoutSeconds: 8.0
  emitEnabled: true
  errorMessageMaxChars: 2000
  eventMaxBytes: 512000 # 500 * 1024
  flushIntervalSeconds: 2.0
  kwargsSummaryMaxKeys: 50
  listLimitCap: 200
  payloadFieldMaxBytes: 204800 # 200 * 1024
  promptPreviewMaxChars: 500
  queueMaxBytes: 134217728 # 128 * 1024 * 1024
  queueMaxEvents: 10000
  resnapshotTurns: 10
  # -- Rollout flag: ship stripped audit image bytes to audit-service for content-addressed blob storage
  imageStoreEnabled: false
  # -- Largest single stripped audit image (bytes) the emitter ships to the image sink
  imageMaxBytes: 716800 # 700 * 1024
  # -- Byte ceiling on the audit emitter's in-memory image queue
  imageQueueMaxBytes: 33554432 # 32 * 1024 * 1024

# -- Live log tail (docs/design-docs/live-logs.md). Services ship their log
# records to audit-service, which buffers them for the Live Logs admin view.
liveLog:
  # -- Serve the live log tail. On by default: a self-hosted install is the case
  # this feature is for. Shipping is demand-gated on top of this, so services
  # send nothing until an operator opens the tail. Turn it off in a shared
  # environment, where the tail is our operational surface and not the tenant's.
  enabled: true
  # -- Allow admins to tail every account's log lines, not just their own.
  # Correct for a single-tenant install; must stay false anywhere several
  # tenants share the deployment, where it would expose one tenant's logs to
  # another.
  allowUnscoped: false
  # -- Pacing and bounds for the in-process shipper every service runs. It drops
  # rather than blocks, so these govern how much it may hold and how long it may
  # wait.
  shipper:
    # -- Count-only bound on each service's shipper queue; oldest records are
    # evicted first, which is what a tail wants
    queueMaxRecords: 10000
    # -- Records the shipper sends to audit-service in one batch
    batchMaxRecords: 500
    # -- Seconds a record waits in the queue before a batch is sent
    flushSeconds: 1.0
    # -- Decaying idle heartbeat: how often the shipper polls for tail demand,
    # stepping to the last tier whose idle threshold has been reached. Tiers must
    # be in ascending threshold order.
    idlePollSchedule:
      - after_idle_seconds: 0
        interval_seconds: 3
      - after_idle_seconds: 120
        interval_seconds: 15
      - after_idle_seconds: 600
        interval_seconds: 30
    # -- Tracebacks longer than this are truncated, and flagged on the record
    maxExceptionBytes: 16384
    # -- Timeout on the shipper's call to audit-service. Kept short: a shipper
    # that blocks is worse than one that drops.
    requestTimeoutSeconds: 5.0
    # -- Shutdown drain budget for the shipper, in seconds
    drainTimeoutSeconds: 3.0
    # -- Minimum gap between a shipper's reports of records it lost, so the loss
    # can be alerted on rather than only counted in-process
    backpressureLogSeconds: 60.0
  # -- Bounds on the buffer table both writers -- audit-service's service ingest
  # and the API's relay of browser logs -- trim, so they agree on its size.
  buffer:
    # -- Row cap on the buffer table. Sized to cover a client's reconnect gap,
    # not to hold history; dominates under load.
    maxRows: 100000
    # -- Age cap on the buffer table, applied alongside the row cap. Dominates
    # when the system is quiet.
    maxAgeSeconds: 900
    # -- Minimum gap between trims in one writer process. The bounds hold
    # approximately; trimming per write has every writer deleting from the same
    # hot range under its insert locks.
    trimIntervalSeconds: 10.0
    # -- Seconds audit-service caches the answer to "is a tail open?" before
    # re-reading the lease table. Every ingest batch asks, so this bounds that
    # read rate.
    tailCacheSeconds: 2.0
  # -- The API's tail read path: lease renewal, opening snapshot, poll pacing,
  # and the tighter caps on the untrusted browser relay.
  tail:
    # -- Seconds a poll cycle of an open tail extends the shipping lease.
    # Services ship only while an unexpired lease exists, so this also bounds how
    # long shipping outlives a crashed API pod.
    leaseSeconds: 60
    # -- Seconds between an open tail's polls for new lines
    streamPollSeconds: 1.0
    # -- Idle seconds after which the tail sends an SSE keepalive comment
    streamHeartbeatSeconds: 20.0
    # -- Lines sent when a tail opens. Sized for time-to-first-paint, not history.
    snapshotLines: 500
    # -- Maximum lines a single tail poll returns
    streamPageSize: 500
    # -- Maximum records accepted per browser-forwarded log batch. Browser input
    # is untrusted, so this is capped tighter than anything on the service side.
    clientMaxRecords: 100

db:
  timeout:
    connect: 10.0
    pool: 10.0
    queryRead: 120.0
    read: 60.0
    write: 10.0

# -- Client-side knobs used by callers of python-service (API and workers).
# The sandbox's own configuration lives under `pythonService.sandbox`.
python:
  # -- Upper bound on items per chunk; the count used is derived from the operator's time limit
  batchChunkItemsMax: 200
  # -- Chunks of one batch dispatched concurrently
  chunkConcurrency: 2
  # -- Concurrent python-service requests one worker process may have in flight
  maxInflight: 4
  # -- Seconds added to the execution budget to form the HTTP read timeout
  timeoutMarginSeconds: 60.0
  # -- Attempts per execution request before giving up
  maxAttempts: 4
  # -- Request payload ceiling enforced before send, in bytes
  maxRequestBytes: 48000000

auditService:
  replicaCount: 1
  image:
    name: audit-service
    # -- Overwrites global value if set
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  database:
    # -- Persistent DB connections held by the pool. SQLAlchemy's own default,
    # named explicitly so the connection budget sums a visible number
    poolSize: 5
    # -- Extra connections allowed beyond poolSize
    maxOverflow: 10
    # -- Seconds a request waits for a connection before failing
    poolTimeout: 5
    # -- Retry-After sent on the 503 that pool exhaustion produces. No admission
    # gate sits in front of this pool, so exhaustion is the overload path. Also
    # sent with the 503 for a database connection lost to a failover
    capacityRetryAfterSeconds: 2
  # -- Months of partitions `/audit/maintain` keeps ahead of ingest on each daily run
  partitionPrecreateMonths: 3
  export:
    # -- Ingest-lag settle time before an export window is declared complete
    watermarkMinutes: 15
    # -- Bounded catch-up horizon the export scan considers for missing windows
    scanLookbackHours: 26
    # -- Oldest-incomplete-window age past which the scan logs a lag alert
    lagAlertMinutes: 120
  # -- Deployment resoruce contraints (i.e. requests/limits)
  resources: {}
  # -- Optional horizontal pod autoscaler. Requires CPU/memory requests to be
  # set under `resources` for the targeted metrics to work. When enabled,
  # `replicaCount` is ignored (the HPA manages the replica count).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    # -- Target average CPU utilization (% of requests). Set to null to disable.
    targetCPUUtilizationPercentage: 80
    # -- Target average memory utilization (% of requests). Set to null to disable.
    targetMemoryUtilizationPercentage: 80
  serviceAccount:
    # -- Create a service account for this deployment's pods
    create: false
    # -- Service account name to use; if empty and `create` is true a name is generated
    name: ""
    # -- Annotations to add to the created service account (e.g. for workload identity)
    annotations: {}
  # -- Pod volumes to mount into the deployment (list of Kubernetes volume specs)
  volumes: []
  # -- Container volume mounts (list of Kubernetes volumeMount specs)
  volumeMounts: []
  # -- Pod tolerations (overrides `global.tolerations`)
  tolerations: []
  # -- Pod affinity rules (overrides `global.affinity`)
  affinity: {}
  # -- Annotations added to this workload's metadata (merged with `global.annotations`; per-service keys take precedence)
  annotations: {}

pythonService:
  # -- Each pod runs one execution at a time and turns away the rest with a 503, so size this to the workers' total `python.maxInflight`
  replicaCount: 1
  image:
    name: python-service
    # -- Overwrites global value if set
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  # -- Request timeout the service is deployed with; its clients size their chunking against it
  requestTimeoutSeconds: 600
  # -- Sandbox limits the code-execution service applies to user code
  sandbox:
    # -- Wall-clock ceiling applied to every execution, in seconds
    maxTimeout: 300
    # -- stdout/stderr capture cap, in bytes
    maxOutputBytes: 1000000
    # -- Per-result size ceiling, in bytes
    maxResultBytes: 8000000
    # -- Request payload ceiling enforced on receipt, in bytes
    maxRequestBytes: 48000000
    # -- Extra wall-clock allowed for subprocess spawn and the first heavy import
    batchStartupGraceSeconds: 15.0
    # -- CPU-seconds backstop behind the wall-clock timeout; a floor, scaled by the execution's wall budget
    rlimitCPUSeconds: 60
    # -- CPU-seconds the backstop allows per second of wall budget (the instance's core count)
    rlimitCPUPerWallSecond: 2
    # -- CPU-seconds of slack above the scaled backstop, for the startup CPU
    # boost. Not a per-execution budget; the wall clock is.
    rlimitCPUHeadroomSeconds: 30
    # -- Process and thread cap for the service's UID, counted across the whole node (must not starve numpy threads)
    rlimitNProc: 512
    # -- Largest file the child may write, in bytes
    rlimitFSizeBytes: 64000000
    # -- Open file descriptor cap
    rlimitNoFile: 256
    # -- Threads per native pool (OpenMP, OpenBLAS, MKL, numexpr) in user code; match the pod's CPU limit
    nativeThreads: 2
    # -- Exit cleanly after this many executions; <= 0 disables recycling
    recycleAfterNExecutions: 100
    # -- `on` requires the Linux sandbox mechanisms; `off` is a local-dev escape hatch only
    enforcement: "on"
    # -- Retry-After, in seconds, on the 503 a pod returns while it is already running an execution
    busyRetryAfterSeconds: 1
  # -- Mount the Kubernetes API token. User code can read it, so leave this off unless something needs it
  automountServiceAccountToken: false
  # -- Pod security context. The UID/GID are the image's `pysandbox` user; sharing a UID with other workloads shares their RLIMIT_NPROC budget
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1774
    runAsGroup: 1338
  # -- Container security context
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  # -- Prefer scheduling replicas on different nodes, since replicas on one node share a process budget
  spreadAcrossNodes: true
  # -- Deployment resoruce contraints (i.e. requests/limits)
  resources: {}
  # -- Optional horizontal pod autoscaler. Requires CPU/memory requests to be
  # set under `resources` for the targeted metrics to work. When enabled,
  # `replicaCount` is ignored (the HPA manages the replica count).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    # -- Target average CPU utilization (% of requests). Set to null to disable.
    targetCPUUtilizationPercentage: 80
    # -- Target average memory utilization (% of requests). Set to null to disable.
    targetMemoryUtilizationPercentage: 80
  serviceAccount:
    # -- Create a service account for this deployment's pods
    create: false
    # -- Service account name to use; if empty and `create` is true a name is generated
    name: ""
    # -- Annotations to add to the created service account (e.g. for workload identity)
    annotations: {}
  # -- Pod volumes to mount into the deployment (list of Kubernetes volume specs)
  volumes: []
  # -- Container volume mounts (list of Kubernetes volumeMount specs)
  volumeMounts: []
  # -- Pod tolerations (overrides `global.tolerations`)
  tolerations: []
  # -- Pod affinity rules (overrides `global.affinity`)
  affinity: {}
  # -- Annotations added to this workload's metadata (merged with `global.annotations`; per-service keys take precedence)
  annotations: {}