apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ragnerock.fullname" . }}-python-service
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
    {{- include "ragnerock.selectorLabels" (dict "context" . "component" "python-service") | nindent 4 }}
{{- with (include "ragnerock.annotations" (dict "context" . "config" .Values.pythonService)) }}
  annotations:
    {{- . | nindent 4 }}
{{- end }}
spec:
{{- if not .Values.pythonService.autoscaling.enabled }}
  replicas: {{ .Values.pythonService.replicaCount }}
{{- end }}
  revisionHistoryLimit: {{ .Values.global.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "ragnerock.selectorLabels" (dict "context" . "component" "python-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ragnerock.labels" . | nindent 8 }}
        {{- include "ragnerock.selectorLabels" (dict "context" . "component" "python-service") | nindent 8 }}
    spec:
{{- with (include "ragnerock.serviceAccountName" (dict "context" . "config" .Values.pythonService.serviceAccount "component" "python-service")) }}
      serviceAccountName: {{ . }}
{{- end }}
      # User code can read any file the pod can, so the Kubernetes API token
      # stays out unless an install explicitly needs it.
      automountServiceAccountToken: {{ .Values.pythonService.automountServiceAccountToken }}
{{- with .Values.pythonService.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- if .Values.pythonService.spreadAcrossNodes }}
      # RLIMIT_NPROC is counted per UID across the whole node, so replicas
      # sharing a node share one budget. Prefer, but don't require, one node each.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "ragnerock.selectorLabels" (dict "context" . "component" "python-service") | nindent 14 }}
{{- end }}
{{- with .Values.pythonService.tolerations | default .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.pythonService.affinity | default .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
{{- end }}
      containers:
        - name: python-service
          image: {{ include "ragnerock.image" (dict "global" .Values.global "image" .Values.pythonService.image "chart" .Chart) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
{{- with .Values.pythonService.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
{{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-config
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-python-service
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-otel
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-live-log
            - secretRef:
                name: {{ include "ragnerock.secretName" (dict "context" . "suffix" "otel" "existingSecret" .Values.otel.existingSecret) }}
          env:
            {{- include "ragnerock.otelEnv" (dict "context" . "service" "python-service") | nindent 12 }}
{{- with .Values.pythonService.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
{{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
{{- with .Values.pythonService.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.pythonService.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ragnerock.fullname" . }}-python-service
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
    {{- include "ragnerock.selectorLabels" (dict "context" . "component" "python-service") | nindent 4 }}
spec:
  type: {{ .Values.pythonService.service.type }}
  ports:
    - port: {{ .Values.pythonService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ragnerock.selectorLabels" (dict "context" . "component" "python-service") | nindent 4 }}
