{{- if .Values.maintenance.enabled }}
  {{/*
  The chart's periodic maintenance job.
  
  Every route it fires is an internal, scheduler-guarded endpoint that on GCP
  is driven by Cloud Scheduler. A self-hosted install has no Cloud Scheduler,
  so without this none of them run: compat execution history grows without
  bound, an ephemeral endpoint's uncollected results are retained forever, and
  an ingest run whose execution was lost is never failed and keeps its source
  from running again.
  
  The guard (`require_scheduler_caller`) verifies a Google OIDC token minted by
  a specific service account, which is a GCP mechanism a Kubernetes CronJob has
  no way to produce. It is a no-op while `CALLBACK_AUTH_ENABLED` is false —
  which is what the chart relies on, and which is the API's own default because
  the chart never sets that variable.
  
  So on Kubernetes these routes are protected by network isolation, not by a
  credential: they are reachable only from inside the cluster, and the chart
  ships no ingress. An operator who sets `CALLBACK_AUTH_ENABLED=true` through
  `api.extraEnv` will break this job — it has no token to send — and should
  disable it (`maintenance.enabled: false`) and drive the routes some other
  way. `values.yaml` says the same beside the switch.
  
  Python's urllib rather than curl: the runtime images deliberately carry no
  curl, and every other in-cluster HTTP check in this repo is written the same
  way.
  */}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ragnerock.fullname" . }}-maintenance
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
    {{- include "ragnerock.selectorLabels" (dict "context" . "component" "maintenance") | nindent 4 }}
  {{- with (include "ragnerock.annotations" (dict "context" . "config" .Values.maintenance)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ .Values.maintenance.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.maintenance.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.maintenance.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ .Values.maintenance.startingDeadlineSeconds }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.maintenance.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "ragnerock.selectorLabels" (dict "context" . "component" "maintenance") | nindent 12 }}
        spec:
  {{- with (include "ragnerock.serviceAccountName" (dict "context" . "config" .Values.maintenance.serviceAccount "component" "maintenance")) }}
          serviceAccountName: {{ . }}
  {{- end }}
  {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
  {{- end }}
  {{- with .Values.maintenance.tolerations | default .Values.global.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
  {{- end }}
  {{- with .Values.maintenance.affinity | default .Values.global.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
  {{- end }}
          restartPolicy: Never
          containers:
            - name: maintenance
              image: {{ include "ragnerock.image" (dict "global" .Values.global "image" .Values.maintenance.image "chart" .Chart) }}
              imagePullPolicy: {{ .Values.global.image.pullPolicy }}
              env:
                - name: API_SELF_URL
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "ragnerock.fullname" . }}-api-url
                      key: API_SELF_URL
                - name: MAINTENANCE_TIMEOUT_SECONDS
                  value: {{ .Values.maintenance.timeoutSeconds | quote }}
              command:
                - python
                - -c
                - |
                  import json, os, sys, urllib.error, urllib.request

                  base = os.environ["API_SELF_URL"].rstrip("/")
                  timeout = float(os.environ["MAINTENANCE_TIMEOUT_SECONDS"])
                  # Every route is idempotent, so one failing does not stop
                  # the rest; the job fails at the end if any did, which is
                  # what makes a persistent problem visible in the job's
                  # failure history rather than only in logs.
                  routes = [
                      "/api/endpoints/internal/prune-executions",
                      "/api/endpoints/internal/reap-ephemeral",
                      "/ingest/internal/maintenance",
                      "/api/oauth/internal/prune",
                  ]
                  failed = []
                  for route in routes:
                      request = urllib.request.Request(
                          base + route, method="POST", data=b""
                      )
                      try:
                          with urllib.request.urlopen(request, timeout=timeout) as r:
                              body = r.read().decode("utf-8", "replace")
                          print(json.dumps({"route": route, "status": r.status, "body": body}))
                      except (urllib.error.URLError, OSError) as exc:
                          print(json.dumps({"route": route, "error": str(exc)}), file=sys.stderr)
                          failed.append(route)
                  if failed:
                      sys.exit(1)
  {{- with .Values.maintenance.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
  {{- end }}
{{- end }}
