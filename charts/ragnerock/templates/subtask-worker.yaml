apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ragnerock.fullname" . }}-subtask-worker
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
    {{- include "ragnerock.selectorLabels" (dict "context" . "component" "subtask-worker") | nindent 4 }}
{{- with (include "ragnerock.annotations" (dict "context" . "config" .Values.subtaskWorker)) }}
  annotations:
    {{- . | nindent 4 }}
{{- end }}
spec:
{{- if not .Values.subtaskWorker.autoscaling.enabled }}
  replicas: {{ .Values.subtaskWorker.replicaCount }}
{{- end }}
  revisionHistoryLimit: {{ .Values.global.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "ragnerock.selectorLabels" (dict "context" . "component" "subtask-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ragnerock.labels" . | nindent 8 }}
        {{- include "ragnerock.selectorLabels" (dict "context" . "component" "subtask-worker") | nindent 8 }}
    spec:
{{- with (include "ragnerock.serviceAccountName" (dict "context" . "config" .Values.subtaskWorker.serviceAccount "component" "subtask-worker")) }}
      serviceAccountName: {{ . }}
{{- end }}
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.subtaskWorker.tolerations | default .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
{{- end }}
      # Document jobs run for minutes. Must exceed preStopSleepSeconds +
      # uvicorn's --timeout-graceful-shutdown (90s), or in-flight jobs are
      # SIGKILLed mid-flight on every rollout.
      terminationGracePeriodSeconds: {{ .Values.subtaskWorker.terminationGracePeriodSeconds | default 120 }}
      containers:
        - name: subtask-worker
          image: {{ include "ragnerock.image" (dict "global" .Values.global "image" .Values.subtaskWorker.image "chart" .Chart) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # Served by a dedicated thread with its own event loop, so probes
            # are answerable even when the main loop is saturated.
            # See docs/design-docs/event-loop-offload.md in the ragnerock repo.
            - name: health
              containerPort: {{ .Values.subtaskWorker.healthPort | default 8081 }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-config
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-db
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-db-service
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-limits
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-otel
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-worker
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-subtask-worker
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-model-service
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-queue
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-audit
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-iam
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-audience
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-callback-delivery
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-parsing
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-python
            - configMapRef:
                name: {{ include "ragnerock.fullname" . }}-db-conn
            - secretRef:
                name: {{ include "ragnerock.secretName" (dict "context" . "suffix" "db" "existingSecret" .Values.database.existingSecret) }}
            - secretRef:
                name: {{ include "ragnerock.secretName" (dict "context" . "suffix" "llm" "existingSecret" .Values.llm.existingSecret) }}
{{- if eq .Values.llm.pdfParserBackend "textract" }}
            - secretRef:
                name: {{ include "ragnerock.secretName" (dict "context" . "suffix" "textract" "existingSecret" .Values.llm.textract.existingSecret) }}
{{- end }}
            - secretRef:
                name: {{ include "ragnerock.secretName" (dict "context" . "suffix" "encryption" "existingSecret" .Values.encryption.existingSecret) }}
            - secretRef:
                name: {{ include "ragnerock.secretName" (dict "context" . "suffix" "otel" "existingSecret" .Values.otel.existingSecret) }}
            - secretRef:
                name: {{ include "ragnerock.secretName" (dict "context" . "suffix" "license" "existingSecret" .Values.licenseExistingSecret) }}
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=subtask-worker,deployment.environment={{ .Values.config.environmentIdentifier }}
            - name: OTEL_SERVICE_NAME
              value: subtask-worker
            # The stuck-job reconciliation sweep runs on the worker
            # deployment only; running it here too would just multiply
            # sweepers over the same rows.
            - name: JOB_RECONCILE_ENABLED
              value: "false"
            # Explicit pool geometry (overrides the derived size, which
            # overcounts on this deployment — the shared limits configmap
            # includes job limits this deployment never serves).
{{- with .Values.subtaskWorker.dbPool.size }}
            - name: DB_POOL_SIZE
              value: {{ include "ragnerock.number" . | quote }}
{{- end }}
{{- with .Values.subtaskWorker.dbPool.maxOverflow }}
            - name: DB_MAX_OVERFLOW
              value: {{ include "ragnerock.number" . | quote }}
{{- end }}
{{- with .Values.subtaskWorker.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
{{- end }}
          # Probes target the isolated `health` port, not `http`: on the main
          # port a busy event loop could not answer within the timeout, and the
          # kubelet killed containers that were busy rather than broken — with
          # no application log line, since a kubelet kill is not an app error.
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Replaces initialDelaySeconds: a slow start (license check, first DB
          # connect) gets up to 150s without making liveness lenient forever.
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          # Leave Service endpoints before uvicorn starts draining, so in-flight
          # traffic is not routed to a shutting-down pod.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ .Values.subtaskWorker.preStopSleepSeconds | default 5 }}"]
{{- with .Values.subtaskWorker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.subtaskWorker.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ragnerock.fullname" . }}-subtask-worker
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
    {{- include "ragnerock.selectorLabels" (dict "context" . "component" "subtask-worker") | nindent 4 }}
spec:
  type: {{ .Values.subtaskWorker.service.type }}
  ports:
    - port: {{ .Values.subtaskWorker.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.api.healthPort }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "ragnerock.selectorLabels" (dict "context" . "component" "subtask-worker") | nindent 4 }}
