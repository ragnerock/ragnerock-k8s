apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-agent
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  AGENT_MAX_ITERATIONS: "{{ include "ragnerock.number" .Values.agent.maxIterations }}"
  # Turn-budget, reasoning, drain, context-eviction, and image knobs — read only
  # in the API process (the sole Runner host); other services ignore them in
  # .configignore. The two nullable budgets render empty when unset; the
  # settings-side validator reads "" as None.
  AGENT_TURN_TOKEN_BUDGET: "{{ if .Values.agent.turnTokenBudget }}{{ include "ragnerock.number" .Values.agent.turnTokenBudget }}{{ end }}"
  AGENT_TOKEN_BUDGET_SOFT_FRACTION: "{{ include "ragnerock.number" .Values.agent.tokenBudgetSoftFraction }}"
  AGENT_CACHED_TOKEN_WEIGHT: "{{ include "ragnerock.number" .Values.agent.cachedTokenWeight }}"
  AGENT_SUB_AGENT_BUDGET_FRACTION: "{{ include "ragnerock.number" .Values.agent.subAgentBudgetFraction }}"
  AGENT_REASONING_ENABLED: "{{ .Values.agent.reasoningEnabled }}"
  AGENT_DRAIN_TOOL_CALLS: "{{ .Values.agent.drainToolCalls }}"
  AGENT_CONTEXT_EVICTION_HIGH_WATER_TOKENS: "{{ if .Values.agent.contextEvictionHighWaterTokens }}{{ include "ragnerock.number" .Values.agent.contextEvictionHighWaterTokens }}{{ end }}"
  AGENT_CONTEXT_EVICTION_LOW_WATER_TOKENS: "{{ include "ragnerock.number" .Values.agent.contextEvictionLowWaterTokens }}"
  AGENT_CONTEXT_EVICTION_MIN_CHARS: "{{ include "ragnerock.number" .Values.agent.contextEvictionMinChars }}"
  AGENT_TOOL_RESULT_IMAGES: "{{ .Values.agent.toolResultImages }}"
  NOTEBOOK_SANDBOX_CODE_CELLS: "{{ .Values.notebook.sandboxCodeCells }}"
  AUDIT_NOTEBOOK_TURN_SNAPSHOT: "{{ .Values.notebook.auditTurnSnapshot }}"
  NOTEBOOK_COMPACTION_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.notebook.compactionTimeoutSeconds }}"
---
apiVersion: v1
