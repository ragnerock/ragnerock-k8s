---
# audit-service configuration: ingest-time derivation caps, the partition
# lifecycle, and the blob-export scan that self-dispatches /audit/export-run
# tasks. LOG_LEVEL / ENVIRONMENT_IDENTIFIER come from the shared `-config` map.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-audit-service
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  AUDIT_PROMPT_PREVIEW_MAX_CHARS: "{{ include "ragnerock.number" .Values.audit.promptPreviewMaxChars }}"
  AUDIT_ERROR_MESSAGE_MAX_CHARS: "{{ include "ragnerock.number" .Values.audit.errorMessageMaxChars }}"
  AUDIT_PARTITION_PRECREATE_MONTHS: "{{ include "ragnerock.number" .Values.auditService.partitionPrecreateMonths }}"
  AUDIT_EXPORT_RUN_URL: http://{{ include "ragnerock.fullname" . }}-audit-service:{{ include "ragnerock.number" .Values.auditService.service.port }}/audit/export-run
  AUDIT_EXPORT_RUN_AUDIENCE: http://{{ include "ragnerock.fullname" . }}-audit-service:{{ include "ragnerock.number" .Values.auditService.service.port }}
  AUDIT_EXPORT_WATERMARK_MINUTES: "{{ include "ragnerock.number" .Values.auditService.export.watermarkMinutes }}"
  AUDIT_EXPORT_SCAN_LOOKBACK_HOURS: "{{ include "ragnerock.number" .Values.auditService.export.scanLookbackHours }}"
  AUDIT_EXPORT_LAG_ALERT_MINUTES: "{{ include "ragnerock.number" .Values.auditService.export.lagAlertMinutes }}"
  # Every live-log ingest batch asks whether a tail is open; this bounds how
  # often that question reaches the lease table. The rest of the live-log
  # settings this service reads come from the `-live-log` and `-core` maps.
  LIVE_LOG_TAIL_CACHE_SECONDS: "{{ include "ragnerock.number" .Values.liveLog.buffer.tailCacheSeconds }}"
  CLOUD_TASKS_AUDIT_EXPORT_QUEUE_NAME: "{{ .Values.queue.auditExportQueueName }}"
  CLOUD_TASKS_ENABLED: "true"
  CLOUD_TASKS_PROJECT_ID: local
  CLOUD_TASKS_ENDPOINT: {{ include "ragnerock.fullname" . }}-queue:{{ include "ragnerock.number" .Values.queue.port }}
  CLOUD_TASKS_MAX_DISPATCHES_PER_SECOND: "{{ include "ragnerock.number" .Values.queue.maxDispatchesPerSecond }}"
  CLOUD_TASKS_MAX_CONCURRENT_DISPATCHES: "{{ include "ragnerock.number" .Values.queue.maxConcurrentDispatches }}"
