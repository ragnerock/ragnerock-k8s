apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-config
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  ENVIRONMENT_IDENTIFIER: {{ .Values.config.environmentIdentifier }}
  LOG_LEVEL: {{ .Values.config.logLevel }}
  RAGNEROCK_SAFETY_ENABLED: "{{ .Values.ragnerock.safetyEnabled }}"
  MODEL_HTTP_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.model.httpTimeoutSeconds }}"
---
# Settings read from core.settings by core code, and so needed by every service
# that runs core in-process. The two sandboxed services — analysis-toolkit and
# python-service — do not, which is why this is separate from the `-config` map
# they share with everything else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-core
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  ANNOTATION_TOOL_MAX_ITERATIONS: "{{ include "ragnerock.number" .Values.agent.annotationToolMaxIterations }}"
  MAX_FALLBACK_DEPTH: "{{ include "ragnerock.number" .Values.fallback.maxDepth }}"
  MAX_FALLBACK_CHAIN_CIPHERTEXT_BYTES: "{{ include "ragnerock.number" .Values.fallback.maxChainCiphertextBytes }}"
  MEMORY_TOOLS_ENABLED: "{{ .Values.memory.toolsEnabled }}"
  MEMORY_SCHEMA_SOFT_CAP: "{{ include "ragnerock.number" .Values.memory.schemaSoftCap }}"
  MEMORY_SCHEMA_HARD_CAP: "{{ include "ragnerock.number" .Values.memory.schemaHardCap }}"
  MEMORY_WRITE_BUDGET_ANNOTATION: "{{ include "ragnerock.number" .Values.memory.writeBudgetAnnotation }}"
  MEMORY_WRITE_BUDGET_NOTEBOOK: "{{ include "ragnerock.number" .Values.memory.writeBudgetNotebook }}"
  RESOURCE_VALUE_MAX_BYTES: "{{ include "ragnerock.number" .Values.workflowResources.valueMaxBytes }}"
  LIVE_LOG_MAX_ROWS: "{{ include "ragnerock.number" .Values.liveLogs.maxRows }}"
  LIVE_LOG_MAX_AGE_SECONDS: "{{ include "ragnerock.number" .Values.liveLogs.maxAgeSeconds }}"
  LIVE_LOG_TRIM_INTERVAL_SECONDS: "{{ include "ragnerock.number" .Values.liveLogs.trimIntervalSeconds }}"
  TABULAR_LIST_PAGE_SIZE: "{{ include "ragnerock.number" .Values.tabular.listPageSize }}"
  TABULAR_PROMPT_MAX_COLUMNS: "{{ include "ragnerock.number" .Values.tabular.promptMaxColumns }}"
  TABULAR_PROMPT_MAX_SOURCES: "{{ include "ragnerock.number" .Values.tabular.promptMaxSources }}"
  TABULAR_READ_ROWS_PER_PAGE: "{{ include "ragnerock.number" .Values.tabular.readRowsPerPage }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-api-tokens
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  ACCESS_TOKEN_EXPIRE_MINUTES: "{{ include "ragnerock.number" .Values.auth.accessTokenExpireMinutes }}"
  ACCESS_CODE_EXPIRE_MINUTES: "{{ include "ragnerock.number" .Values.auth.accessCodeExpireMinutes }}"
  AUTH_LOCKOUT_MAX_ATTEMPTS: "{{ include "ragnerock.number" .Values.auth.lockoutMaxAttempts }}"
---
# The API's own address, in its own map because every service that calls back
# into the API needs it while the rest of the `-api` map below is API-only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-api-url
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  API_SELF_URL: "http://{{ include "ragnerock.fullname" . }}-api:8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-api
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  DB_POOL_SIZE: "{{ include "ragnerock.number" .Values.database.poolSize }}"
  DB_MAX_OVERFLOW: "{{ include "ragnerock.number" .Values.database.maxOverflow }}"
  DB_POOL_TIMEOUT: "{{ include "ragnerock.number" .Values.database.poolTimeout }}"
  # Per-pod request-capacity shedding and the event-loop offload threadpool.
  MAX_CONCURRENT_REQUESTS: "{{ include "ragnerock.number" .Values.api.maxConcurrentRequests }}"
  CAPACITY_WAIT_SECONDS: "{{ include "ragnerock.number" .Values.api.capacityWaitSeconds }}"
  DB_THREADPOOL_SIZE: "{{ include "ragnerock.number" .Values.api.dbThreadpoolSize }}"
  # Fixed geometry rather than a tunable: the isolated health server has to sit
  # on a port other than the main app port (8080).
  HEALTH_PORT: "8081"
  # Compatibility endpoints and the retention sweep over their execution
  # records, both of which only the API runs.
  ENDPOINTS_COMPAT_MAX_BODY_BYTES: "{{ include "ragnerock.number" .Values.endpoints.compatMaxBodyBytes }}"
  ENDPOINTS_COMPAT_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.endpoints.compatTimeoutSeconds }}"
  ENDPOINT_EXECUTION_RETENTION_DAYS: "{{ include "ragnerock.number" .Values.endpoints.executionRetentionDays }}"
  ENDPOINT_EXECUTION_PRUNE_BATCH_SIZE: "{{ include "ragnerock.number" .Values.endpoints.executionPruneBatchSize }}"
  ENDPOINT_EXECUTION_PRUNE_MAX_BATCHES: "{{ include "ragnerock.number" .Values.endpoints.executionPruneMaxBatches }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-rate-limits
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  RATE_LIMIT_WINDOW_MINUTES: "{{ include "ragnerock.number" .Values.rateLimits.windowMinutes }}"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.requestsPerMinute }}"
  RATE_LIMIT_CHAT_CREATE_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.chatCreatePerMinute }}"
  RATE_LIMIT_DOCUMENT_CHUNK_CREATE_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.documentChunkCreatePerMinute }}"
  RATE_LIMIT_FRONTEND_EVENTS_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.frontendEventsPerMinute }}"
  RATE_LIMIT_AUTH_LOGIN_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.authLoginPerMinute }}"
  RATE_LIMIT_AUTH_REGISTER_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.authRegisterPerMinute }}"
  RATE_LIMIT_AUTH_GOOGLE_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.authGooglePerMinute }}"
  RATE_LIMIT_AUTH_REQUEST_CODE_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.authRequestCodePerMinute }}"
  RATE_LIMIT_AUTH_VALIDATE_CODE_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.authValidateCodePerMinute }}"
  RATE_LIMIT_AUTH_CHANGE_PASSWORD_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.authChangePasswordPerMinute }}"
  RATE_LIMIT_AGENT_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.agentPerMinute }}"
  RATE_LIMIT_NOTEBOOK_CODE_FEEDBACK_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.notebookCodeFeedbackPerMinute }}"
  RATE_LIMIT_DOCUMENT_UPLOAD_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.documentUploadPerMinute }}"
  RATE_LIMIT_SEARCH_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.searchPerMinute }}"
  RATE_LIMIT_INGEST_TRIGGER_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.ingestTriggerPerMinute }}"
  RATE_LIMIT_TOOLS_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.toolsPerMinute }}"
  RATE_LIMIT_ANNOTATION_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.annotationPerMinute }}"
  RATE_LIMIT_DEBUG_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.debugPerMinute }}"
  RATE_LIMIT_WORKFLOW_TEST_CONDITION_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.workflowTestConditionPerMinute }}"
  RATE_LIMIT_CONFIG_VALIDATE_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.configValidatePerMinute }}"
  RATE_LIMIT_ADMIN_MUTATION_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.adminMutationPerMinute }}"
  RATE_LIMIT_IAM_MUTATION_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.iamMutationPerMinute }}"
  RATE_LIMIT_API_TOKEN_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.apiTokenPerMinute }}"
  RATE_LIMIT_NOTIFICATION_STREAM_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.notificationStreamPerMinute }}"
  RATE_LIMIT_QUERY_ASSIST: "{{ include "ragnerock.number" .Values.rateLimits.queryAssistPerMinute }}"
  RATE_LIMIT_QUERY_EXECUTE: "{{ include "ragnerock.number" .Values.rateLimits.queryExecutePerMinute }}"
  RATE_LIMIT_QUERY_VALIDATE: "{{ include "ragnerock.number" .Values.rateLimits.queryValidatePerMinute }}"
  RATE_LIMIT_AUDIT_PAYLOAD_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.auditPayloadPerMinute }}"
  RATE_LIMIT_OPERATOR_TEST_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.operatorTestPerMinute }}"
  RATE_LIMIT_BACKFILL_RUN_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.backfillRunPerMinute }}"
  RATE_LIMIT_LIVE_LOG_STREAM_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.liveLogStreamPerMinute }}"
  RATE_LIMIT_LIVE_LOG_CLIENT_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.liveLogClientPerMinute }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-analysis-toolkit
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  ANALYSIS_TOOLKIT_URL: http://{{ include "ragnerock.fullname" . }}-analysis-toolkit:{{ include "ragnerock.number" .Values.analysisToolkit.service.port }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-data-ingestor
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  DATA_INGESTOR_URL: http://{{ include "ragnerock.fullname" . }}-data-ingestor:{{ include "ragnerock.number" .Values.dataIngestor.service.port }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-db-service
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  DB_SERVICE_URL: http://{{ include "ragnerock.fullname" . }}-db-service:{{ include "ragnerock.number" .Values.dbService.service.port }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-db-service-config
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  BATCH_LIMIT: "{{ include "ragnerock.number" .Values.dbService.batchLimit }}"
  RATE_LIMIT_MAX_TOKENS: "{{ include "ragnerock.number" .Values.dbService.rateLimitMaxTokens }}"
  RATE_LIMIT_REFILL_RATE: "{{ include "ragnerock.number" .Values.dbService.rateLimitRefillRate }}"
  CONNECTION_FAILURE_THRESHOLD: "{{ include "ragnerock.number" .Values.dbService.connectionFailureThreshold }}"
  DEFAULT_DB_POOL_SIZE: "{{ include "ragnerock.number" .Values.dbService.defaultDBPoolSize }}"
  DEFAULT_DB_MAX_OVERFLOW: "{{ include "ragnerock.number" .Values.dbService.defaultDBMaxOverflow }}"
  REQUEST_THREADPOOL_SIZE: "{{ include "ragnerock.number" .Values.dbService.requestThreadpoolSize }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-db
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  DB_HOST: {{ .Values.database.host }}
  DB_PORT: "{{ include "ragnerock.number" .Values.database.port }}"
  DB_NAME: {{ .Values.database.name }}
  DB_USER: {{ .Values.database.user }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-db-conn
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  DB_HTTP_TIMEOUT_CONNECT: "{{ include "ragnerock.number" .Values.db.timeout.connect }}"
  DB_HTTP_TIMEOUT_POOL: "{{ include "ragnerock.number" .Values.db.timeout.pool }}"
  DB_HTTP_TIMEOUT_QUERY_READ: "{{ include "ragnerock.number" .Values.db.timeout.queryRead }}"
  DB_HTTP_TIMEOUT_READ: "{{ include "ragnerock.number" .Values.db.timeout.read }}"
  DB_HTTP_TIMEOUT_WRITE: "{{ include "ragnerock.number" .Values.db.timeout.write }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-otel
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  OTEL_ENABLED: "{{ .Values.otel.enabled }}"
  OTEL_SDK_DISABLED: {{ eq (.Values.otel.enabled | toString) "true" | not | toString | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.exporterEndpoint }}
  OTEL_EXPORTER_OTLP_INSECURE: "{{ .Values.otel.exporterInsecure }}"
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.otel.exporterProtocol }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-frontend
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  NEXT_PUBLIC_API_URL: {{ .Values.api.url }}
  FRONTEND_ORIGIN: {{ .Values.frontend.url }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-worker
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  WORKER_URL: http://{{ include "ragnerock.fullname" . }}-worker:{{ include "ragnerock.number" .Values.worker.service.port }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-parsing
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  PDF_PARSER_BACKEND: "{{ .Values.llm.pdfParserBackend }}"
  PDF_EXTRACT_IMAGES: "{{ .Values.llm.pdfExtractImages }}"
{{- if eq .Values.llm.pdfParserBackend "azure" }}
  AZURE_DOC_INTEL_ENDPOINT: "{{ .Values.llm.azure.endpoint }}"
{{- end }}
{{- if eq .Values.llm.pdfParserBackend "textract" }}
  AWS_TEXTRACT_REGION: "{{ .Values.llm.textract.region }}"
  AWS_ACCESS_KEY_ID: "{{ .Values.llm.textract.accessKeyId }}"
  TEXTRACT_MAX_CONCURRENCY: "{{ include "ragnerock.number" .Values.llm.textract.maxConcurrency }}"
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-agent
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  AGENT_MAX_ITERATIONS: "{{ include "ragnerock.number" .Values.agent.maxIterations }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-tools
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  CODE_TOOL_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.tools.codeToolTimeoutSeconds }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-audit
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  AUDIT_BATCH_MAX_BYTES: "{{ include "ragnerock.number" .Values.audit.batchMaxBytes }}"
  AUDIT_BATCH_MAX_EVENTS: "{{ include "ragnerock.number" .Values.audit.batchMaxEvents }}"
  AUDIT_DRAIN_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.audit.drainTimeoutSeconds }}"
  AUDIT_EMIT_ENABLED: "{{ .Values.audit.emitEnabled }}"
  AUDIT_ERROR_MESSAGE_MAX_CHARS: "{{ include "ragnerock.number" .Values.audit.errorMessageMaxChars }}"
  AUDIT_EVENT_MAX_BYTES: "{{ include "ragnerock.number" .Values.audit.eventMaxBytes }}"
  AUDIT_FLUSH_INTERVAL_SECONDS: "{{ include "ragnerock.number" .Values.audit.flushIntervalSeconds }}"
  AUDIT_INGEST_URL: http://{{ include "ragnerock.fullname" . }}-audit-service:{{ include "ragnerock.number" .Values.auditService.service.port }}/audit/ingest
  AUDIT_KWARGS_SUMMARY_MAX_KEYS: "{{ include "ragnerock.number" .Values.audit.kwargsSummaryMaxKeys }}"
  AUDIT_PAYLOAD_FIELD_MAX_BYTES: "{{ include "ragnerock.number" .Values.audit.payloadFieldMaxBytes }}"
  AUDIT_QUEUE_MAX_BYTES: "{{ include "ragnerock.number" .Values.audit.queueMaxBytes }}"
  AUDIT_QUEUE_MAX_EVENTS: "{{ include "ragnerock.number" .Values.audit.queueMaxEvents }}"
---
# Audit knobs read only in the API process: the event-list cap belongs to the
# audit read side (api.routers.audit / core.audit.query) and the re-snapshot
# cadence to the agent Runner, which only the API constructs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-audit-api
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  AUDIT_LIST_LIMIT_CAP: "{{ include "ragnerock.number" .Values.audit.listLimitCap }}"
  AUDIT_RESNAPSHOT_TURNS: "{{ include "ragnerock.number" .Values.audit.resnapshotTurns }}"
---
# IAM permissions-cache TTL (core.iam.constants). Only the API and the two
# workers reach the IAM permission cache.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-iam
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  IAM_PERMISSIONS_CACHE_TTL: "{{ include "ragnerock.number" .Values.iam.permissionsCacheTTL }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-subtask-worker
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  SUBTASK_WORKER_URL: http://{{ include "ragnerock.fullname" . }}-subtask-worker:{{ include "ragnerock.number" .Values.subtaskWorker.service.port }}
  PDF_PARSER_BACKEND: "{{ .Values.llm.pdfParserBackend }}"
{{- if eq .Values.llm.pdfParserBackend "azure" }}
  AZURE_DOC_INTEL_ENDPOINT: "{{ .Values.llm.azure.endpoint }}"
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-model-service
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  MODEL_URL: http://{{ include "ragnerock.fullname" . }}-model-service:{{ include "ragnerock.number" .Values.modelService.service.port }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-model
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  GEMINI_MODEL_NAME: {{ .Values.model.geminiModelName | quote }}
  GEMINI_MAX_OUTPUT_TOKENS: "{{ include "ragnerock.number" .Values.model.geminiMaxOutputTokens }}"
  GEMINI_THINKING_LEVEL: {{ .Values.model.geminiThinkingLevel | quote }}
  GEMINI_TRUNCATION_RETRIES: "{{ include "ragnerock.number" .Values.model.geminiTruncationRetries }}"
  MAX_CONCURRENT_PROVIDER_CALLS: "{{ include "ragnerock.number" .Values.model.maxConcurrentProviderCalls }}"
  # Retry shaping for a provider with no fallback chain behind it, and the
  # budgets the model-service spends working through one that has.
  AGENT_NO_CHAIN_MAX_ATTEMPTS: "{{ include "ragnerock.number" .Values.model.agentNoChainMaxAttempts }}"
  ANNOTATOR_NO_CHAIN_MAX_ATTEMPTS: "{{ include "ragnerock.number" .Values.model.annotatorNoChainMaxAttempts }}"
  ANNOTATOR_RETRY_BUDGET_SECONDS: "{{ include "ragnerock.number" .Values.model.annotatorRetryBudgetSeconds }}"
  FALLBACK_CHAIN_BUDGET_SECONDS: "{{ include "ragnerock.number" .Values.fallback.chainBudgetSeconds }}"
  FALLBACK_AGENT_CHAIN_BUDGET_SECONDS: "{{ include "ragnerock.number" .Values.fallback.agentChainBudgetSeconds }}"
  FALLBACK_PER_PROVIDER_ATTEMPTS: "{{ include "ragnerock.number" .Values.fallback.perProviderAttempts }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-queue
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  CLOUD_TASKS_ENABLED: "true"
  CLOUD_TASKS_JOB_QUEUE_NAME: "{{ .Values.queue.jobQueueName }}"
  CLOUD_TASKS_SUBTASK_QUEUE_NAME: "{{ .Values.queue.subtaskQueueName }}"
  CLOUD_TASKS_CALLBACK_QUEUE: "{{ .Values.queue.callbackQueueName }}"
  CLOUD_TASKS_MAX_DISPATCHES_PER_SECOND: "{{ include "ragnerock.number" .Values.queue.maxDispatchesPerSecond }}"
  CLOUD_TASKS_MAX_CONCURRENT_DISPATCHES: "{{ include "ragnerock.number" .Values.queue.maxConcurrentDispatches }}"
  QUEUE_POOL_SIZE: "{{ include "ragnerock.number" .Values.queue.queuePoolSize }}"
  CLOUD_TASKS_ENDPOINT: {{ include "ragnerock.fullname" . }}-queue:{{ include "ragnerock.number" .Values.queue.port }}
  CLOUD_TASKS_PROJECT_ID: local
  CLOUD_TASKS_AUDIT_QUEUE: "{{ .Values.queue.auditQueueName }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-limits
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  MAX_CONCURRENT_SUBTASKS: "{{ include "ragnerock.number" .Values.limits.concurrency.maxConcurrentSubtasks }}"
  MAX_CONCURRENT_ANNOTATIONS: "{{ include "ragnerock.number" .Values.limits.concurrency.maxConcurrentAnnotations }}"
  MAX_CONCURRENT_JOBS: "{{ include "ragnerock.number" .Values.limits.concurrency.maxConcurrentJobs }}"
  EMBEDDING_BATCH_SIZE: "{{ include "ragnerock.number" .Values.limits.batches.embedding }}"
  ANNOTATION_BATCH_SIZE: "{{ include "ragnerock.number" .Values.limits.batches.annotation }}"
  TABULAR_ANNOTATION_BATCH_SIZE: "{{ include "ragnerock.number" .Values.limits.batches.tabularAnnotation }}"
  DEFAULT_ROW_BATCH_SIZE: "{{ include "ragnerock.number" .Values.limits.batches.defaultRow }}"
  SUBTASK_MAX_ATTEMPTS: "{{ include "ragnerock.number" .Values.limits.subtask.maxAttempts }}"
  SUBTASK_FAILURE_THRESHOLD: "{{ include "ragnerock.number" .Values.limits.subtask.failureThreshold }}"
  SUBTASK_STALE_THRESHOLD_MINUTES: "{{ include "ragnerock.number" .Values.limits.subtask.staleThresholdMinutes }}"
  JOB_WATCHDOG_SLACK_MINUTES: "{{ include "ragnerock.number" .Values.limits.job.watchdogSlackMinutes }}"
  CODE_OPERATOR_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.limits.codeOperator.timeoutSeconds }}"
---
# Runtime geometry shared by the worker and subtask-worker: delivery-capacity
# shedding, phase-advance concurrency, DB pool/threadpool sizing, the
# job-reconciliation sweep, and the code-operator resource caps. Both run the
# same job-processing code, so they are tuned as a pair.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-worker-runtime
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  CAPACITY_WAIT_SECONDS: "{{ include "ragnerock.number" .Values.workers.capacityWaitSeconds }}"
  MAX_CONCURRENT_JOB_ADVANCES: "{{ include "ragnerock.number" .Values.workers.maxConcurrentJobAdvances }}"
  MAX_CHUNK_CHARS: "{{ include "ragnerock.number" .Values.workers.maxChunkChars }}"
  # Pool sizing mirrors the worker's own in-process derivation (one connection
  # per possible in-flight handler, plus headroom for non-request work), so an
  # unset poolSize/maxOverflow lands on the same geometry the service would
  # have picked for itself.
  DB_POOL_SIZE: "{{ include "ragnerock.number" (.Values.workers.database.poolSize | default (add .Values.limits.concurrency.maxConcurrentSubtasks .Values.limits.concurrency.maxConcurrentJobs .Values.workers.maxConcurrentJobAdvances .Values.workers.database.poolHeadroom)) }}"
  DB_MAX_OVERFLOW: "{{ include "ragnerock.number" (.Values.workers.database.maxOverflow | default .Values.workers.database.poolHeadroom) }}"
  DB_POOL_TIMEOUT: "{{ include "ragnerock.number" .Values.workers.database.poolTimeout }}"
  DB_POOL_HEADROOM: "{{ include "ragnerock.number" .Values.workers.database.poolHeadroom }}"
  DB_THREADPOOL_SIZE: "{{ include "ragnerock.number" .Values.workers.dbThreadpoolSize }}"
  DB_LOCK_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.workers.database.lockTimeoutSeconds }}"
  # Fixed geometry rather than a tunable: the isolated health server has to sit
  # on a port other than the main app port (8080).
  HEALTH_PORT: "8081"
  JOB_RECONCILE_ENABLED: "{{ .Values.workers.reconcile.enabled }}"
  JOB_RECONCILE_INTERVAL_SECONDS: "{{ include "ragnerock.number" .Values.workers.reconcile.intervalSeconds }}"
  JOB_RECONCILE_BATCH_SIZE: "{{ include "ragnerock.number" .Values.workers.reconcile.batchSize }}"
  JOB_RECONCILE_NOT_STARTED_AFTER_SECONDS: "{{ include "ragnerock.number" .Values.workers.reconcile.notStartedAfterSeconds }}"
  JOB_RECONCILE_IN_PROGRESS_AFTER_SECONDS: "{{ include "ragnerock.number" .Values.workers.reconcile.inProgressAfterSeconds }}"
  RESOURCE_CONTEXT_MAX_CHARS: "{{ include "ragnerock.number" .Values.workflowResources.contextMaxChars }}"
  CODE_RESOURCE_MAX_BYTES: "{{ include "ragnerock.number" .Values.workflowResources.codeMaxBytes }}"
  CODE_RESOURCE_MAX_ROWS: "{{ include "ragnerock.number" .Values.workflowResources.codeMaxRows }}"
  CODE_RESOURCE_TOTAL_MAX_BYTES: "{{ include "ragnerock.number" .Values.workflowResources.codeTotalMaxBytes }}"
---
