apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-config
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  ENVIRONMENT_IDENTIFIER: {{ .Values.config.environmentIdentifier }}
  LOG_LEVEL: {{ .Values.config.logLevel }}
  RAGNEROCK_SAFETY_ENABLED: "{{ .Values.ragnerock.safetyEnabled }}"
  MODEL_HTTP_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.model.httpTimeoutSeconds }}"
---
# Settings read from core.settings by core code, and so needed by every service
# that runs core in-process. The two sandboxed services — analysis-toolkit and
# python-service — do not, which is why this is separate from the `-config` map
# they share with everything else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-core
  {{- include "ragnerock.apiGateFitsPool" . }}
  {{- include "ragnerock.connectionBudget" . }}
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  ANNOTATION_TOOL_MAX_ITERATIONS: "{{ include "ragnerock.number" .Values.agent.annotationToolMaxIterations }}"
  MAX_CONCURRENT_ANNOTATE_CALLS: "{{ include "ragnerock.number" .Values.model.maxConcurrentAnnotateCalls }}"
  MODEL_SERVICE_ANNOTATE_WAIT_SECONDS: "{{ include "ragnerock.number" .Values.model.annotateWaitSeconds }}"
  MAX_CONCURRENT_ANNOTATION_TARGETS: "{{ include "ragnerock.number" .Values.model.maxConcurrentAnnotationTargets }}"
  # Both the clients' chunk size and the ceiling db-service enforces on every
  # '*-by-ids' route, so the two cannot disagree -- which is why it lives HERE,
  # in the ConfigMap every deployment mounts, and not in `-db-conn`, which
  # db-service does not. Rendering it from two values was two numbers for one
  # decision: the clients read one and the server enforced the other, and
  # raising either alone 422s every by-ids call.
  DB_IDS_PER_REQUEST: "{{ include "ragnerock.number" .Values.limits.dbIdsPerRequest }}"
  MAX_FALLBACK_DEPTH: "{{ include "ragnerock.number" .Values.fallback.maxDepth }}"
  MAX_FALLBACK_CHAIN_CIPHERTEXT_BYTES: "{{ include "ragnerock.number" .Values.fallback.maxChainCiphertextBytes }}"
  MEMORY_TOOLS_ENABLED: "{{ .Values.memory.toolsEnabled }}"
  MEMORY_SCHEMA_SOFT_CAP: "{{ include "ragnerock.number" .Values.memory.schemaSoftCap }}"
  MEMORY_SCHEMA_HARD_CAP: "{{ include "ragnerock.number" .Values.memory.schemaHardCap }}"
  MEMORY_WRITE_BUDGET_ANNOTATION: "{{ include "ragnerock.number" .Values.memory.writeBudgetAnnotation }}"
  MEMORY_WRITE_BUDGET_NOTEBOOK: "{{ include "ragnerock.number" .Values.memory.writeBudgetNotebook }}"
  MEMORY_SEARCH_BUDGET_ANNOTATION: "{{ include "ragnerock.number" .Values.memory.searchBudgetAnnotation }}"
  MESSAGE_BOARD_ENABLED: "{{ .Values.messageBoard.enabled }}"
  MESSAGE_BOARD_MAX_BODY_CHARS: "{{ include "ragnerock.number" .Values.messageBoard.maxBodyChars }}"
  MESSAGE_BOARD_INBOX_MAX_ENTRIES: "{{ include "ragnerock.number" .Values.messageBoard.inboxMaxEntries }}"
  MESSAGE_BOARD_MAX_HANDLES: "{{ include "ragnerock.number" .Values.messageBoard.maxHandles }}"
  MESSAGE_BOARD_INBOX_MAX_AGE_DAYS: "{{ include "ragnerock.number" .Values.messageBoard.inboxMaxAgeDays }}"
  MESSAGE_BOARD_WRITE_BUDGET: "{{ include "ragnerock.number" .Values.messageBoard.writeBudget }}"
  SKILLS_ENABLED: "{{ .Values.skills.enabled }}"
  SKILL_BODY_MAX_CHARS: "{{ include "ragnerock.number" .Values.skills.bodyMaxChars }}"
  SKILL_DESCRIPTION_MAX_CHARS: "{{ include "ragnerock.number" .Values.skills.descriptionMaxChars }}"
  SKILL_MAX_PER_OPERATOR: "{{ include "ragnerock.number" .Values.skills.maxPerOperator }}"
  SKILL_LOAD_MAX_CALLS: "{{ include "ragnerock.number" .Values.skills.loadMaxCalls }}"
  # Agent tools (agent-tools design §10): the ops kill switch plus the size,
  # time, and concurrency bounds for user-defined MCP/REST tools and the
  # system-tool catalog. Every core-running service carries them for settings
  # parity as it does in Terraform.
  AGENT_TOOLS_ENABLED: "{{ .Values.agentTools.enabled }}"
  AGENT_TOOL_PRIVATE_EGRESS_ALLOWLIST: "{{ .Values.agentTools.privateEgressAllowlist }}"
  AGENT_TOOL_MAX_USER_TOOLS_PER_PROJECT: "{{ include "ragnerock.number" .Values.agentTools.maxUserToolsPerProject }}"
  AGENT_TOOL_MAX_PER_OPERATOR: "{{ include "ragnerock.number" .Values.agentTools.maxPerOperator }}"
  AGENT_TOOL_MAX_FUNCTIONS_PER_AGENT: "{{ include "ragnerock.number" .Values.agentTools.maxFunctionsPerAgent }}"
  AGENT_TOOL_REST_MAX_ROUTES: "{{ include "ragnerock.number" .Values.agentTools.restMaxRoutes }}"
  AGENT_TOOL_MCP_MAX_FUNCTIONS: "{{ include "ragnerock.number" .Values.agentTools.mcpMaxFunctions }}"
  AGENT_TOOL_MAX_HEADERS: "{{ include "ragnerock.number" .Values.agentTools.maxHeaders }}"
  AGENT_TOOL_HEADER_VALUE_MAX_CHARS: "{{ include "ragnerock.number" .Values.agentTools.headerValueMaxChars }}"
  AGENT_TOOL_DESCRIPTION_MAX_CHARS: "{{ include "ragnerock.number" .Values.agentTools.descriptionMaxChars }}"
  AGENT_TOOL_PARAM_DESCRIPTION_MAX_CHARS: "{{ include "ragnerock.number" .Values.agentTools.paramDescriptionMaxChars }}"
  AGENT_TOOL_SCHEMA_MAX_BYTES: "{{ include "ragnerock.number" .Values.agentTools.schemaMaxBytes }}"
  AGENT_TOOL_SCHEMA_MAX_DEPTH: "{{ include "ragnerock.number" .Values.agentTools.schemaMaxDepth }}"
  AGENT_TOOL_CALL_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.agentTools.callTimeoutSeconds }}"
  AGENT_TOOL_CALL_TIMEOUT_MAX_SECONDS: "{{ include "ragnerock.number" .Values.agentTools.callTimeoutMaxSeconds }}"
  AGENT_TOOL_BUILD_TIME_BUDGET_SECONDS: "{{ include "ragnerock.number" .Values.agentTools.buildTimeBudgetSeconds }}"
  AGENT_TOOL_ROW_TIME_BUDGET_SECONDS: "{{ include "ragnerock.number" .Values.agentTools.rowTimeBudgetSeconds }}"
  AGENT_TOOL_BUSY_WAIT_SECONDS: "{{ include "ragnerock.number" .Values.agentTools.busyWaitSeconds }}"
  AGENT_TOOL_CONNECT_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.agentTools.connectTimeoutSeconds }}"
  AGENT_TOOL_DISCOVERY_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.agentTools.discoveryTimeoutSeconds }}"
  AGENT_TOOL_RESPONSE_MAX_BYTES: "{{ include "ragnerock.number" .Values.agentTools.responseMaxBytes }}"
  AGENT_TOOL_RESULT_MAX_CHARS: "{{ include "ragnerock.number" .Values.agentTools.resultMaxChars }}"
  AGENT_TOOL_REQUEST_BODY_MAX_BYTES: "{{ include "ragnerock.number" .Values.agentTools.requestBodyMaxBytes }}"
  AGENT_TOOL_MAX_CALLS_PER_INVOCATION: "{{ include "ragnerock.number" .Values.agentTools.maxCallsPerInvocation }}"
  AGENT_TOOL_MAX_CONCURRENT_CALLS: "{{ include "ragnerock.number" .Values.agentTools.maxConcurrentCalls }}"
  AGENT_TOOL_MAX_RESULT_IMAGES: "{{ include "ragnerock.number" .Values.agentTools.maxResultImages }}"
  AGENT_TOOL_AUDIT_RESULT_MAX_CHARS: "{{ include "ragnerock.number" .Values.agentTools.auditResultMaxChars }}"
  ANNOTATION_TOOL_CALL_RECORD_RESULT_MAX_CHARS: "{{ include "ragnerock.number" .Values.agentTools.annotationToolCallRecordResultMaxChars }}"
  AGENT_TOOL_EXECUTION_LOG_ENABLED: "{{ .Values.agentTools.executionLogEnabled }}"
  AGENT_TOOL_EXECUTION_LOG_WRITE_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.agentTools.executionLogWriteTimeoutSeconds }}"
  # Web search and web fetch (web-search/fetch design §9): the kill switch, the
  # network policy for model-chosen URLs, and the byte/time/concurrency bounds.
  # Every core-running service carries them for settings parity as it does in
  # Terraform. The fetch blocklist is seeded with this release's own service
  # hostnames — a model-chosen URL must not be able to point back at the
  # deployment — plus whatever public names the operator adds.
  WEB_TOOLS_ENABLED: "{{ .Values.webTools.enabled }}"
  WEB_TOOL_PRIVATE_EGRESS_ALLOWLIST: "{{ .Values.webTools.privateEgressAllowlist }}"
  WEB_FETCH_ALLOW_HTTP: "{{ .Values.webTools.fetchAllowHttp }}"
  WEB_FETCH_BLOCKLIST: "{{ include "ragnerock.webFetchBlocklist" . }}"
  WEB_FETCH_RESPECT_ROBOTS: "{{ .Values.webTools.fetchRespectRobots }}"
  WEB_FETCH_MAX_CONCURRENT_PER_HOST: "{{ include "ragnerock.number" .Values.webTools.fetchMaxConcurrentPerHost }}"
  WEB_FETCH_MAX_REDIRECTS: "{{ include "ragnerock.number" .Values.webTools.fetchMaxRedirects }}"
  WEB_FETCH_MAX_BYTES: "{{ include "ragnerock.number" .Values.webTools.fetchMaxBytes }}"
  WEB_FETCH_PDF_MAX_BYTES: "{{ include "ragnerock.number" .Values.webTools.fetchPdfMaxBytes }}"
  WEB_FETCH_MAX_CONCURRENT_PDF: "{{ include "ragnerock.number" .Values.webTools.fetchMaxConcurrentPdf }}"
  WEB_FETCH_PDF_MAX_PAGES: "{{ include "ragnerock.number" .Values.webTools.fetchPdfMaxPages }}"
  WEB_FETCH_RESULT_MAX_CHARS: "{{ include "ragnerock.number" .Values.webTools.fetchResultMaxChars }}"
  WEB_FETCH_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.webTools.fetchTimeoutSeconds }}"
  WEB_FETCH_ROBOTS_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.webTools.fetchRobotsTimeoutSeconds }}"
  WEB_FETCH_ROBOTS_CACHE_TTL_SECONDS: "{{ include "ragnerock.number" .Values.webTools.fetchRobotsCacheTtlSeconds }}"
  WEB_FETCH_EXTRACT_THREADS: "{{ include "ragnerock.number" .Values.webTools.fetchExtractThreads }}"
  WEB_TOOL_MAX_CONCURRENT_CALLS: "{{ include "ragnerock.number" .Values.webTools.maxConcurrentCalls }}"
  WEB_TOOL_CACHE_MAX_ENTRIES: "{{ include "ragnerock.number" .Values.webTools.cacheMaxEntries }}"
  WEB_TOOL_CACHE_MAX_BYTES: "{{ include "ragnerock.number" .Values.webTools.cacheMaxBytes }}"
  WEB_TOOL_USER_AGENT: "{{ .Values.webTools.userAgent }}"
  WEB_TOOL_AUDIT_RESULT_MAX_CHARS: "{{ include "ragnerock.number" .Values.webTools.auditResultMaxChars }}"
  WEB_SEARCH_DEFAULT_RESULTS: "{{ include "ragnerock.number" .Values.webTools.searchDefaultResults }}"
  WEB_SEARCH_MAX_RESULTS: "{{ include "ragnerock.number" .Values.webTools.searchMaxResults }}"
  WEB_SEARCH_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.webTools.searchTimeoutSeconds }}"
  WEB_SEARCH_MAX_CALLS_PER_INVOCATION: "{{ include "ragnerock.number" .Values.webTools.searchMaxCallsPerInvocation }}"
  WEB_SEARCH_MAX_CALLS_PER_TURN: "{{ include "ragnerock.number" .Values.webTools.searchMaxCallsPerTurn }}"
  WEB_SEARCH_ACCOUNT_DAILY_CAP: "{{ include "ragnerock.number" .Values.webTools.searchAccountDailyCap }}"
  WEB_SEARCH_RETRY_ATTEMPTS: "{{ include "ragnerock.number" .Values.webTools.searchRetryAttempts }}"
  WEB_SEARCH_BRAVE_URL: {{ .Values.webTools.searchBraveUrl | quote }}
  RESOURCE_VALUE_MAX_BYTES: "{{ include "ragnerock.number" .Values.workflowResources.valueMaxBytes }}"
  # DocumentJobScope read switch (big-job-improvements design). The scope row
  # is always planned and its counter always written; this decides only whether
  # completion, advancement, the failure threshold and the API read the ledger
  # or fall back to counting subtask rows, so it is safe to flip either way
  # with jobs in flight. Every core-running service carries it, as in Terraform.
  JOB_SCOPE_ACCOUNTING_ENABLED: "{{ .Values.jobScope.accountingEnabled }}"
  TABULAR_LIST_PAGE_SIZE: "{{ include "ragnerock.number" .Values.tabular.listPageSize }}"
  TABULAR_PROMPT_MAX_COLUMNS: "{{ include "ragnerock.number" .Values.tabular.promptMaxColumns }}"
  TABULAR_PROMPT_MAX_SOURCES: "{{ include "ragnerock.number" .Values.tabular.promptMaxSources }}"
  TABULAR_READ_ROWS_PER_PAGE: "{{ include "ragnerock.number" .Values.tabular.readRowsPerPage }}"
  # Node decorators (JUDGE/CHECK/CRITIC/TOKEN_BUDGET): the kill switch and the
  # write-time/runtime bounds, read by core validation (API) and the worker
  # chain. Every core-running service carries them for settings parity as it
  # does in Terraform.
  DECORATORS_ENABLED: "{{ .Values.decorators.enabled }}"
  DECORATOR_MAX_PER_NODE: "{{ include "ragnerock.number" .Values.decorators.maxPerNode }}"
  DECORATOR_JUDGE_MAX_RUNS: "{{ include "ragnerock.number" .Values.decorators.judgeMaxRuns }}"
  DECORATOR_CHECK_MAX_ATTEMPTS: "{{ include "ragnerock.number" .Values.decorators.checkMaxAttempts }}"
  DECORATOR_MAX_LEAF_CALLS: "{{ include "ragnerock.number" .Values.decorators.maxLeafCalls }}"
  DECORATOR_RENDER_MAX_CHARS: "{{ include "ragnerock.number" .Values.decorators.renderMaxChars }}"
  DECORATOR_CHECK_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.decorators.checkTimeoutSeconds }}"
  # Live-log buffer trim bounds. Only the API and audit-service write to the
  # buffer, but they read the bounds through core.settings, and every
  # core-running service carries them for settings parity as it does in
  # Terraform.
  LIVE_LOG_MAX_ROWS: "{{ include "ragnerock.number" .Values.liveLog.buffer.maxRows }}"
  LIVE_LOG_MAX_AGE_SECONDS: "{{ include "ragnerock.number" .Values.liveLog.buffer.maxAgeSeconds }}"
  LIVE_LOG_TRIM_INTERVAL_SECONDS: "{{ include "ragnerock.number" .Values.liveLog.buffer.trimIntervalSeconds }}"
---
# License validation. Every licensed service reads these: the startup check
# refuses to serve without a valid license, and the periodic monitor
# re-validates daily and stops the process once the license lapses. See
# docs/design-docs/periodic-license-checks.md. The key itself is a Secret
# (`-license`), not a ConfigMap value.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-license
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  RAGNEROCK_LICENSE_SERVER_URL: "{{ .Values.licenseServerUrl }}"
  LICENSE_CHECK_ENABLED: "{{ .Values.licenseCheck.enabled }}"
  LICENSE_CHECK_INTERVAL_SECONDS: "{{ include "ragnerock.number" .Values.licenseCheck.intervalSeconds }}"
  LICENSE_CHECK_RETRY_SECONDS: "{{ include "ragnerock.number" .Values.licenseCheck.retrySeconds }}"
  LICENSE_CHECK_GRACE_SECONDS: "{{ include "ragnerock.number" .Values.licenseCheck.graceSeconds }}"
  LICENSE_CHECK_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.licenseCheck.timeoutSeconds }}"
  LICENSE_CHECK_SHUTDOWN_GRACE_SECONDS: "{{ include "ragnerock.number" .Values.licenseCheck.shutdownGraceSeconds }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-api-tokens
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  ACCESS_TOKEN_EXPIRE_MINUTES: "{{ include "ragnerock.number" .Values.auth.accessTokenExpireMinutes }}"
  ACCESS_CODE_EXPIRE_MINUTES: "{{ include "ragnerock.number" .Values.auth.accessCodeExpireMinutes }}"
  AUTH_LOCKOUT_MAX_ATTEMPTS: "{{ include "ragnerock.number" .Values.auth.lockoutMaxAttempts }}"
---
# The API's own address, in its own map because every service that calls back
# into the API needs it while the rest of the `-api` map below is API-only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-api-url
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  API_SELF_URL: "http://{{ include "ragnerock.fullname" . }}-api:8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-api
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  API_SELF_URL: "http://{{ include "ragnerock.fullname" . }}-api:8080"
  DB_POOL_SIZE: "{{ include "ragnerock.number" .Values.database.poolSize }}"
  DB_MAX_OVERFLOW: "{{ include "ragnerock.number" .Values.database.maxOverflow }}"
  DB_POOL_TIMEOUT: "{{ include "ragnerock.number" .Values.database.poolTimeout }}"
  # Per-pod request-capacity shedding and the event-loop offload threadpool.
  MAX_CONCURRENT_REQUESTS: "{{ include "ragnerock.number" .Values.api.maxConcurrentRequests }}"
  MAX_CONCURRENT_STREAMS: "{{ include "ragnerock.number" .Values.api.maxConcurrentStreams }}"
  CAPACITY_WAIT_SECONDS: "{{ include "ragnerock.number" .Values.api.capacityWaitSeconds }}"
  CAPACITY_RETRY_AFTER_SECONDS: "{{ include "ragnerock.number" .Values.api.capacityRetryAfterSeconds }}"
  DB_SERVICE_MAX_CONNECTIONS: "{{ include "ragnerock.number" .Values.api.dbServiceMaxConnections }}"
  DB_THREADPOOL_SIZE: "{{ include "ragnerock.number" .Values.api.dbThreadpoolSize }}"
  # Fixed geometry rather than a tunable: the isolated health server has to sit
  # on a port other than the main app port (8080).
  HEALTH_PORT: "8081"
  # Compatibility endpoints and the retention sweep over their execution
  # records, both of which only the API runs.
  ENDPOINTS_COMPAT_MAX_BODY_BYTES: "{{ include "ragnerock.number" .Values.endpoints.compatMaxBodyBytes }}"
  ENDPOINTS_COMPAT_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.endpoints.compatTimeoutSeconds }}"
  ENDPOINT_EXECUTION_RETENTION_DAYS: "{{ include "ragnerock.number" .Values.endpoints.executionRetentionDays }}"
  ENDPOINT_EXECUTION_PRUNE_BATCH_SIZE: "{{ include "ragnerock.number" .Values.endpoints.executionPruneBatchSize }}"
  ENDPOINT_EXECUTION_PRUNE_MAX_BATCHES: "{{ include "ragnerock.number" .Values.endpoints.executionPruneMaxBatches }}"
  # The MCP front on workflow endpoints, which only the API serves. The wait
  # and result limits are quoted verbatim in the tool contract every agent
  # reads, so changing one changes a published contract.
  ENDPOINTS_MCP_ENABLED: "{{ .Values.endpoints.mcp.enabled }}"
  ENDPOINTS_MCP_DEFAULT_WAIT_SECONDS: "{{ include "ragnerock.number" .Values.endpoints.mcp.defaultWaitSeconds }}"
  ENDPOINTS_MCP_MAX_WAIT_SECONDS: "{{ include "ragnerock.number" .Values.endpoints.mcp.maxWaitSeconds }}"
  ENDPOINTS_MCP_STALE_HINT_SECONDS: "{{ include "ragnerock.number" .Values.endpoints.mcp.staleHintSeconds }}"
  ENDPOINTS_MCP_RESULT_MAX_BYTES: "{{ include "ragnerock.number" .Values.endpoints.mcp.resultMaxBytes }}"
  ENDPOINTS_MCP_ALLOW_URL_INPUTS: "{{ .Values.endpoints.mcp.allowUrlInputs }}"
  ENDPOINTS_MCP_URL_FETCH_BUDGET_SECONDS: "{{ include "ragnerock.number" .Values.endpoints.mcp.urlFetchBudgetSeconds }}"
  ENDPOINTS_MCP_URL_CONNECT_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.endpoints.mcp.urlConnectTimeoutSeconds }}"
  ENDPOINTS_MCP_ALLOW_PRIVATE_URL_INPUTS: "{{ .Values.endpoints.mcp.allowPrivateUrlInputs }}"
  ENDPOINTS_MCP_POLL_SECONDS: "{{ include "ragnerock.number" .Values.endpoints.mcp.pollSeconds }}"
  ENDPOINTS_MCP_KEEPALIVE_SECONDS: "{{ include "ragnerock.number" .Values.endpoints.mcp.keepaliveSeconds }}"
  ENDPOINTS_MCP_MAX_BODY_BYTES: "{{ include "ragnerock.number" .Values.endpoints.mcp.maxBodyBytes }}"
  ENDPOINTS_MCP_MAX_WAITERS: "{{ include "ragnerock.number" .Values.endpoints.mcp.maxWaiters }}"
  # GitOps apply, which only the API serves.
  GITOPS_MAX_MANIFEST_BYTES: "{{ include "ragnerock.number" .Values.gitops.maxManifestBytes }}"
  GITOPS_CODE_REVIEW_BUDGET_SECONDS: "{{ include "ragnerock.number" .Values.gitops.codeReviewBudgetSeconds }}"
  # Workbench attachment parsing (POST /api/operators/parse-sample) and the
  # operator-test sandbox deadline. The timeout reads the same value the
  # workers get, so a workbench test cannot time out differently from the
  # production run it stands in for.
  OPERATOR_SAMPLE_MAX_FILE_BYTES: "{{ include "ragnerock.number" .Values.api.operatorSample.maxFileBytes }}"
  OPERATOR_SAMPLE_PARSE_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.api.operatorSample.parseTimeoutSeconds }}"
  CODE_OPERATOR_MAX_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.limits.codeOperator.maxTimeoutSeconds }}"
  CODE_OPERATOR_MAX_TIMEOUT_SECONDS_SHEET: "{{ include "ragnerock.number" .Values.limits.codeOperator.maxTimeoutSecondsSheet }}"
  CODE_OPERATOR_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.limits.codeOperator.timeoutSeconds }}"
  # Workflow workbench (chat, try-it-out, auto mode) — API-only: the workers
  # never serve a workbench session. The auto caps bound one autonomous
  # session; the retentions prune its restore points and debug sessions.
  WORKBENCH_AUTO_ENABLED: "{{ .Values.workbench.autoEnabled }}"
  WORKBENCH_AUTO_MAX_ITERATIONS: "{{ include "ragnerock.number" .Values.workbench.autoMaxIterations }}"
  WORKBENCH_AUTO_MAX_CYCLES: "{{ include "ragnerock.number" .Values.workbench.autoMaxCycles }}"
  WORKBENCH_AUTO_TOKEN_BUDGET: "{{ include "ragnerock.number" .Values.workbench.autoTokenBudget }}"
  WORKBENCH_AUTO_MAX_TARGETS: "{{ include "ragnerock.number" .Values.workbench.autoMaxTargets }}"
  WORKBENCH_RUN_RESULT_MAX_CHARS_PER_NODE: "{{ include "ragnerock.number" .Values.workbench.runResultMaxCharsPerNode }}"
  WORKBENCH_SNAPSHOT_RETENTION: "{{ include "ragnerock.number" .Values.workbench.snapshotRetention }}"
  WORKBENCH_DEBUG_SESSION_RETENTION: "{{ include "ragnerock.number" .Values.workbench.debugSessionRetention }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-rate-limits
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  RATE_LIMIT_WINDOW_MINUTES: "{{ include "ragnerock.number" .Values.rateLimits.windowMinutes }}"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.requestsPerMinute }}"
  RATE_LIMIT_CHAT_CREATE_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.chatCreatePerMinute }}"
  RATE_LIMIT_DOCUMENT_CHUNK_CREATE_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.documentChunkCreatePerMinute }}"
  RATE_LIMIT_FRONTEND_EVENTS_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.frontendEventsPerMinute }}"
  RATE_LIMIT_AUTH_LOGIN_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.authLoginPerMinute }}"
  RATE_LIMIT_AUTH_REGISTER_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.authRegisterPerMinute }}"
  RATE_LIMIT_AUTH_GOOGLE_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.authGooglePerMinute }}"
  RATE_LIMIT_AUTH_REQUEST_CODE_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.authRequestCodePerMinute }}"
  RATE_LIMIT_AUTH_VALIDATE_CODE_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.authValidateCodePerMinute }}"
  RATE_LIMIT_AUTH_CHANGE_PASSWORD_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.authChangePasswordPerMinute }}"
  RATE_LIMIT_AGENT_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.agentPerMinute }}"
  RATE_LIMIT_NOTEBOOK_CODE_FEEDBACK_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.notebookCodeFeedbackPerMinute }}"
  RATE_LIMIT_NOTEBOOK_COMPACTION_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.notebookCompactionPerMinute }}"
  RATE_LIMIT_DOCUMENT_UPLOAD_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.documentUploadPerMinute }}"
  RATE_LIMIT_SEARCH_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.searchPerMinute }}"
  RATE_LIMIT_INGEST_TRIGGER_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.ingestTriggerPerMinute }}"
  RATE_LIMIT_TOOLS_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.toolsPerMinute }}"
  RATE_LIMIT_AGENT_TOOL_PROBES_PER_MINUTE: "{{ include "ragnerock.number" .Values.rateLimits.agentToolProbesPerMinute }}"
