  AWS_ACCESS_KEY_ID: "{{ .Values.llm.textract.accessKeyId }}"
  TEXTRACT_MAX_CONCURRENCY: "{{ include "ragnerock.number" .Values.llm.textract.maxConcurrency }}"
{{- end }}
