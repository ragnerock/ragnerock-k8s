metadata:
  name: {{ include "ragnerock.fullname" . }}-tools
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  CODE_TOOL_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.tools.codeToolTimeoutSeconds }}"
  CODE_TOOL_MAX_RESULT_IMAGES: "{{ include "ragnerock.number" .Values.tools.maxResultImages }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-audit
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  AUDIT_BATCH_MAX_BYTES: "{{ include "ragnerock.number" .Values.audit.batchMaxBytes }}"
  AUDIT_BATCH_MAX_EVENTS: "{{ include "ragnerock.number" .Values.audit.batchMaxEvents }}"
  AUDIT_DRAIN_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.audit.drainTimeoutSeconds }}"
  AUDIT_EMIT_ENABLED: "{{ .Values.audit.emitEnabled }}"
  AUDIT_ERROR_MESSAGE_MAX_CHARS: "{{ include "ragnerock.number" .Values.audit.errorMessageMaxChars }}"
  AUDIT_EVENT_MAX_BYTES: "{{ include "ragnerock.number" .Values.audit.eventMaxBytes }}"
  AUDIT_FLUSH_INTERVAL_SECONDS: "{{ include "ragnerock.number" .Values.audit.flushIntervalSeconds }}"
  AUDIT_INGEST_URL: http://{{ include "ragnerock.fullname" . }}-audit-service:{{ include "ragnerock.number" .Values.auditService.service.port }}/audit/ingest
  AUDIT_KWARGS_SUMMARY_MAX_KEYS: "{{ include "ragnerock.number" .Values.audit.kwargsSummaryMaxKeys }}"
  AUDIT_PAYLOAD_FIELD_MAX_BYTES: "{{ include "ragnerock.number" .Values.audit.payloadFieldMaxBytes }}"
  AUDIT_QUEUE_MAX_BYTES: "{{ include "ragnerock.number" .Values.audit.queueMaxBytes }}"
  AUDIT_QUEUE_MAX_EVENTS: "{{ include "ragnerock.number" .Values.audit.queueMaxEvents }}"
  # Audit image sink (image-visibility design §3.2): the emitter ships stripped
  # image bytes to audit-service for content-addressed blob storage. Rides on the
  # -audit ConfigMap alongside the other emitter knobs; db-service mounts this
  # ConfigMap but declares none of these fields, so it ignores them.
  AUDIT_IMAGE_STORE_ENABLED: "{{ .Values.audit.imageStoreEnabled }}"
  AUDIT_IMAGE_INGEST_URL: http://{{ include "ragnerock.fullname" . }}-audit-service:{{ include "ragnerock.number" .Values.auditService.service.port }}/audit/images/ingest
  AUDIT_IMAGE_MAX_BYTES: "{{ include "ragnerock.number" .Values.audit.imageMaxBytes }}"
  AUDIT_IMAGE_QUEUE_MAX_BYTES: "{{ include "ragnerock.number" .Values.audit.imageQueueMaxBytes }}"
---
# Audit knobs read only in the API process: the event-list cap belongs to the
# audit read side (api.routers.audit / core.audit.query) and the re-snapshot
# cadence to the agent Runner, which only the API constructs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-audit-api
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  AUDIT_LIST_LIMIT_CAP: "{{ include "ragnerock.number" .Values.audit.listLimitCap }}"
  AUDIT_RESNAPSHOT_TURNS: "{{ include "ragnerock.number" .Values.audit.resnapshotTurns }}"
---
# The live-log shipper every service runs (live-logs design §2.5). The gate and
# the pacing are shared, so a deployment moves them together; the buffer bounds
# they trim against live in the `-core` map, and the tail read path in
# `-live-log-api`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-live-log
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  LIVE_LOG_ENABLED: "{{ .Values.liveLog.enabled }}"
  LIVE_LOG_INGEST_URL: http://{{ include "ragnerock.fullname" . }}-audit-service:{{ include "ragnerock.number" .Values.auditService.service.port }}/logs/ingest
  LIVE_LOG_INGEST_AUDIENCE: http://{{ include "ragnerock.fullname" . }}-audit-service:{{ include "ragnerock.number" .Values.auditService.service.port }}
  # In-cluster the hop to audit-service is a plain Service call, with no OIDC
  # token issuer behind it — the same reason every other `*_AUTH_ENABLED` is
  # left off in this chart.
  LIVE_LOG_INGEST_AUTH_ENABLED: "false"
  LIVE_LOG_QUEUE_MAX_RECORDS: "{{ include "ragnerock.number" .Values.liveLog.shipper.queueMaxRecords }}"
  LIVE_LOG_BATCH_MAX_RECORDS: "{{ include "ragnerock.number" .Values.liveLog.shipper.batchMaxRecords }}"
  LIVE_LOG_FLUSH_SECONDS: "{{ include "ragnerock.number" .Values.liveLog.shipper.flushSeconds }}"
  # A list of tiers; pydantic reads a structured setting from the environment
  # as JSON.
  LIVE_LOG_IDLE_POLL_SCHEDULE: {{ .Values.liveLog.shipper.idlePollSchedule | toJson | quote }}
  LIVE_LOG_MAX_EXCEPTION_BYTES: "{{ include "ragnerock.number" .Values.liveLog.shipper.maxExceptionBytes }}"
  LIVE_LOG_REQUEST_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.liveLog.shipper.requestTimeoutSeconds }}"
  LIVE_LOG_DRAIN_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.liveLog.shipper.drainTimeoutSeconds }}"
  LIVE_LOG_BACKPRESSURE_LOG_SECONDS: "{{ include "ragnerock.number" .Values.liveLog.shipper.backpressureLogSeconds }}"
---
# The live-log tail read path (§5.2), which only the API serves: lease renewal,
# opening snapshot, poll pacing, scope, and the caps on the browser relay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-live-log-api
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  LIVE_LOGS_ALLOW_UNSCOPED: "{{ .Values.liveLog.allowUnscoped }}"
  LIVE_LOG_LEASE_SECONDS: "{{ include "ragnerock.number" .Values.liveLog.tail.leaseSeconds }}"
  LIVE_LOG_STREAM_POLL_SECONDS: "{{ include "ragnerock.number" .Values.liveLog.tail.streamPollSeconds }}"
  LIVE_LOG_STREAM_HEARTBEAT_SECONDS: "{{ include "ragnerock.number" .Values.liveLog.tail.streamHeartbeatSeconds }}"
  LIVE_LOG_SNAPSHOT_LINES: "{{ include "ragnerock.number" .Values.liveLog.tail.snapshotLines }}"
  LIVE_LOG_STREAM_PAGE_SIZE: "{{ include "ragnerock.number" .Values.liveLog.tail.streamPageSize }}"
  LIVE_LOG_CLIENT_MAX_RECORDS: "{{ include "ragnerock.number" .Values.liveLog.tail.clientMaxRecords }}"
---
# IAM permissions-cache TTL (core.iam.constants). Only the API and the two
# workers reach the IAM permission cache.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-iam
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  IAM_PERMISSIONS_CACHE_TTL: "{{ include "ragnerock.number" .Values.iam.permissionsCacheTTL }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-subtask-worker
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  SUBTASK_WORKER_URL: http://{{ include "ragnerock.fullname" . }}-subtask-worker:{{ include "ragnerock.number" .Values.subtaskWorker.service.port }}
  PDF_PARSER_BACKEND: "{{ .Values.llm.pdfParserBackend }}"
{{- if eq .Values.llm.pdfParserBackend "azure" }}
  AZURE_DOC_INTEL_ENDPOINT: "{{ .Values.llm.azure.endpoint }}"
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-subtask-worker-db
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  # Mounted by the subtask-worker deployment ONLY, after the shared limits map,
  # so it wins there and the plain worker keeps the shared pool. The two are
  # different numbers on purpose: at concurrency 1 the plain worker never serves
  # a subtask, so a pool sized for MAX_CONCURRENT_SUBTASKS is one it holds open
  # for nothing. The -subtask-worker map next door cannot carry this, because the
  # plain worker mounts that one too (it needs SUBTASK_WORKER_URL to publish).
  DB_POOL_SIZE: "{{ include "ragnerock.subtaskWorkerPoolSize" . }}"
  DB_MAX_OVERFLOW: "{{ include "ragnerock.subtaskWorkerMaxOverflow" . }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-model-service
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  MODEL_URL: http://{{ include "ragnerock.fullname" . }}-model-service:{{ include "ragnerock.number" .Values.modelService.service.port }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-model
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  GEMINI_MODEL_NAME: {{ .Values.model.geminiModelName | quote }}
  GEMINI_MAX_OUTPUT_TOKENS: "{{ include "ragnerock.number" .Values.model.geminiMaxOutputTokens }}"
  GEMINI_THINKING_LEVEL: {{ .Values.model.geminiThinkingLevel | quote }}
  GEMINI_TRUNCATION_RETRIES: "{{ include "ragnerock.number" .Values.model.geminiTruncationRetries }}"
  MAX_CONCURRENT_PROVIDER_CALLS: "{{ include "ragnerock.number" .Values.model.maxConcurrentProviderCalls }}"
  PROVIDER_CALL_WAIT_SECONDS: "{{ include "ragnerock.number" .Values.model.providerCallWaitSeconds }}"
  PROVIDER_CALL_RETRY_AFTER_SECONDS: "{{ include "ragnerock.number" .Values.model.providerCallRetryAfterSeconds }}"
  # Retry shaping for a provider with no fallback chain behind it, and the
  # budgets the model-service spends working through one that has.
  AGENT_NO_CHAIN_MAX_ATTEMPTS: "{{ include "ragnerock.number" .Values.model.agentNoChainMaxAttempts }}"
  ANNOTATOR_NO_CHAIN_MAX_ATTEMPTS: "{{ include "ragnerock.number" .Values.model.annotatorNoChainMaxAttempts }}"
  ANNOTATOR_RETRY_BUDGET_SECONDS: "{{ include "ragnerock.number" .Values.model.annotatorRetryBudgetSeconds }}"
  FALLBACK_CHAIN_BUDGET_SECONDS: "{{ include "ragnerock.number" .Values.fallback.chainBudgetSeconds }}"
  FALLBACK_AGENT_CHAIN_BUDGET_SECONDS: "{{ include "ragnerock.number" .Values.fallback.agentChainBudgetSeconds }}"
  FALLBACK_PER_PROVIDER_ATTEMPTS: "{{ include "ragnerock.number" .Values.fallback.perProviderAttempts }}"
  # Reasoning / extended-thinking config (agent-thinking design). Anthropic gets
  # a response-length ceiling and per-effort thinking budgets; Gemini per-effort
  # thinking budgets; OpenAI a Responses-API switch that enables reasoning items.
  ANTHROPIC_MAX_OUTPUT_TOKENS: "{{ include "ragnerock.number" .Values.model.anthropicMaxOutputTokens }}"
  ANTHROPIC_THINKING_BUDGET_LOW: "{{ include "ragnerock.number" .Values.model.anthropicThinkingBudgetLow }}"
  ANTHROPIC_THINKING_BUDGET_MEDIUM: "{{ include "ragnerock.number" .Values.model.anthropicThinkingBudgetMedium }}"
  ANTHROPIC_THINKING_BUDGET_HIGH: "{{ include "ragnerock.number" .Values.model.anthropicThinkingBudgetHigh }}"
  GEMINI_THINKING_BUDGET_LOW: "{{ include "ragnerock.number" .Values.model.geminiThinkingBudgetLow }}"
  GEMINI_THINKING_BUDGET_MEDIUM: "{{ include "ragnerock.number" .Values.model.geminiThinkingBudgetMedium }}"
  GEMINI_THINKING_BUDGET_HIGH: "{{ include "ragnerock.number" .Values.model.geminiThinkingBudgetHigh }}"
  OPENAI_USE_RESPONSES_API: "{{ .Values.model.openaiUseResponsesApi }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-queue
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  CLOUD_TASKS_ENABLED: "true"
  CLOUD_TASKS_JOB_QUEUE_NAME: "{{ .Values.queue.jobQueueName }}"
  CLOUD_TASKS_SUBTASK_QUEUE_NAME: "{{ .Values.queue.subtaskQueueName }}"
  CLOUD_TASKS_CALLBACK_QUEUE: "{{ .Values.queue.callbackQueueName }}"
  QUEUE_POOL_SIZE: "{{ include "ragnerock.number" .Values.queue.queuePoolSize }}"
  CLOUD_TASKS_ENDPOINT: {{ include "ragnerock.fullname" . }}-queue:{{ include "ragnerock.number" .Values.queue.port }}
  CLOUD_TASKS_PROJECT_ID: local
  CLOUD_TASKS_AUDIT_QUEUE: "{{ .Values.queue.auditQueueName }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-limits
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  MAX_CONCURRENT_SUBTASKS: "{{ include "ragnerock.number" .Values.limits.concurrency.maxConcurrentSubtasks }}"
  MAX_CONCURRENT_ANNOTATIONS: "{{ include "ragnerock.number" .Values.limits.concurrency.maxConcurrentAnnotations }}"
  MAX_CONCURRENT_JOBS: "{{ include "ragnerock.number" .Values.limits.concurrency.maxConcurrentJobs }}"
  # Only the job worker is targeted by the API's parse-sample calls; the
  # subtask-worker gets this for settings parity, as it does in Terraform.
  MAX_CONCURRENT_SAMPLE_PARSES: "{{ include "ragnerock.number" .Values.limits.concurrency.maxConcurrentSampleParses }}"
  EMBEDDING_BATCH_SIZE: "{{ include "ragnerock.number" .Values.limits.batches.embedding }}"
  ANNOTATION_BATCH_SIZE: "{{ include "ragnerock.number" .Values.limits.batches.annotation }}"
  TOOL_OPERATOR_SUBTASK_SIZE: "{{ include "ragnerock.number" .Values.limits.batches.toolOperatorSubtask }}"
  ROW_SUBTASK_GRAIN_ENABLED: "{{ .Values.limits.batches.rowSubtaskGrainEnabled }}"
  SUBTASK_TOOL_ELAPSED_CEILING_SECONDS: "{{ include "ragnerock.number" .Values.limits.batches.subtaskToolElapsedCeilingSeconds }}"
  SUBTASK_MAX_ATTEMPTS: "{{ include "ragnerock.number" .Values.limits.subtask.maxAttempts }}"
  SUBTASK_FAILURE_THRESHOLD: "{{ include "ragnerock.number" .Values.limits.subtask.failureThreshold }}"
  SUBTASK_STALE_THRESHOLD_MINUTES: "{{ include "ragnerock.number" .Values.limits.subtask.staleThresholdMinutes }}"
  JOB_WATCHDOG_SLACK_MINUTES: "{{ include "ragnerock.number" .Values.limits.job.watchdogSlackMinutes }}"
  CODE_OPERATOR_MAX_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.limits.codeOperator.maxTimeoutSeconds }}"
  CODE_OPERATOR_MAX_TIMEOUT_SECONDS_SHEET: "{{ include "ragnerock.number" .Values.limits.codeOperator.maxTimeoutSecondsSheet }}"
  CODE_OPERATOR_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.limits.codeOperator.timeoutSeconds }}"
---
# Runtime geometry shared by the worker and subtask-worker: delivery-capacity
# shedding, phase-advance concurrency, DB pool/threadpool sizing, the
# job-reconciliation sweep, and the code-operator resource caps. Both run the
# same job-processing code, so they are tuned as a pair.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-worker-runtime
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  CAPACITY_WAIT_SECONDS: "{{ include "ragnerock.number" .Values.workers.capacityWaitSeconds }}"
  MAX_CONCURRENT_JOB_ADVANCES: "{{ include "ragnerock.number" .Values.workers.maxConcurrentJobAdvances }}"
  MAX_CHUNK_CHARS: "{{ include "ragnerock.number" .Values.workers.maxChunkChars }}"
  # Pool sizing mirrors the worker's own in-process derivation, through the
  # same helper the connection budget sums -- so the number a worker receives
  # and the number the budget checks cannot drift apart.
  DB_POOL_SIZE: "{{ include "ragnerock.workerPoolSize" . }}"
  DB_MAX_OVERFLOW: "{{ include "ragnerock.workerMaxOverflow" . }}"
  DB_POOL_TIMEOUT: "{{ include "ragnerock.number" .Values.workers.database.poolTimeout }}"
  CAPACITY_RETRY_AFTER_SECONDS: "{{ include "ragnerock.number" .Values.workers.capacityRetryAfterSeconds }}"
  DB_SERVICE_MAX_CONNECTIONS: "{{ include "ragnerock.number" .Values.workers.dbServiceMaxConnections }}"
  MAX_INSTANCE_REQUEST_CONCURRENCY: "{{ .Values.workers.maxInstanceRequestConcurrency | default "" }}"
  DB_POOL_HEADROOM: "{{ include "ragnerock.number" .Values.workers.database.poolHeadroom }}"
  DB_THREADPOOL_SIZE: "{{ include "ragnerock.number" .Values.workers.dbThreadpoolSize }}"
  DB_LOCK_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.workers.database.lockTimeoutSeconds }}"
  COMPLETION_LOCK_SLOW_MS: "{{ include "ragnerock.number" .Values.workers.database.completionLockSlowMs }}"
  TABULAR_ROW_INSERT_CHUNK_ROWS: "{{ include "ragnerock.number" .Values.workers.tabularIngest.rowInsertChunkRows }}"
  TABULAR_ROW_INSERT_CHUNK_BYTES: "{{ include "ragnerock.number" .Values.workers.tabularIngest.rowInsertChunkBytes }}"
  SUBTASK_PUBLISH_CONCURRENCY: "{{ include "ragnerock.number" .Values.workers.subtaskPublishConcurrency }}"
  SUBTASK_ENQUEUE_STALE_MINUTES: "{{ include "ragnerock.number" .Values.workers.subtaskEnqueueStaleMinutes }}"
  SUBTASK_INSERT_CHUNK_ROWS: "{{ include "ragnerock.number" .Values.workers.subtaskInsertChunkRows }}"
  MAX_CONCURRENT_SPAWNS: "{{ include "ragnerock.number" .Values.workers.maxConcurrentSpawns }}"
  SPAWN_PAGE_SIZE: "{{ include "ragnerock.number" .Values.workers.spawn.pageSize }}"
  SPAWN_TIME_BUDGET_SECONDS: "{{ include "ragnerock.number" .Values.workers.spawn.timeBudgetSeconds }}"
  SPAWN_PLANNING_STALE_SECONDS: "{{ include "ragnerock.number" .Values.workers.spawn.planningStaleSeconds }}"
  ROW_REFS_PAGE_SIZE: "{{ include "ragnerock.number" .Values.workers.tabularIngest.rowRefsPageSize }}"
  MAX_ROWS_PER_SHEET: "{{ include "ragnerock.number" .Values.workers.tabularIngest.maxRowsPerSheet }}"
  # Fixed geometry rather than a tunable: the isolated health server has to sit
  # on a port other than the main app port (8080).
  HEALTH_PORT: "8081"
  JOB_RECONCILE_ENABLED: "{{ .Values.workers.reconcile.enabled }}"
  JOB_RECONCILE_INTERVAL_SECONDS: "{{ include "ragnerock.number" .Values.workers.reconcile.intervalSeconds }}"
  JOB_RECONCILE_BATCH_SIZE: "{{ include "ragnerock.number" .Values.workers.reconcile.batchSize }}"
  JOB_RECONCILE_NOT_STARTED_AFTER_SECONDS: "{{ include "ragnerock.number" .Values.workers.reconcile.notStartedAfterSeconds }}"
  JOB_RECONCILE_IN_PROGRESS_AFTER_SECONDS: "{{ include "ragnerock.number" .Values.workers.reconcile.inProgressAfterSeconds }}"
  RESOURCE_CONTEXT_MAX_CHARS: "{{ include "ragnerock.number" .Values.workflowResources.contextMaxChars }}"
  AGGREGATION_MAX_UPSTREAM_ROWS: "{{ include "ragnerock.number" .Values.limits.aggregationMaxUpstreamRows }}"
  CODE_RESOURCE_CACHE_MAX_BYTES: "{{ include "ragnerock.number" .Values.workflowResources.codeCacheMaxBytes }}"
  CODE_RESOURCE_MAX_BYTES: "{{ include "ragnerock.number" .Values.workflowResources.codeMaxBytes }}"
  CODE_RESOURCE_MAX_ROWS: "{{ include "ragnerock.number" .Values.workflowResources.codeMaxRows }}"
  CODE_RESOURCE_TOTAL_MAX_BYTES: "{{ include "ragnerock.number" .Values.workflowResources.codeTotalMaxBytes }}"
  # Worker-only: python-service serves one request per instance, so its
  # capacity absorbs the sum of every worker's concurrent calls.
  PYTHON_SERVICE_MAX_INFLIGHT: "{{ include "ragnerock.number" .Values.python.maxInflight }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-audience
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  ANALYSIS_TOOLKIT_AUDIENCE: "http://{{ include "ragnerock.fullname" . }}-analysis-toolkit:{{ include "ragnerock.number" .Values.analysisToolkit.service.port }}"
  API_AUDIENCE: "http://{{ include "ragnerock.fullname" . }}-api:{{ include "ragnerock.number" .Values.api.service.port }}"
  DATA_INGESTOR_AUDIENCE: "http://{{ include "ragnerock.fullname" . }}-data-ingestor:{{ include "ragnerock.number" .Values.dataIngestor.service.port }}"
  DB_SERVICE_AUDIENCE: "http://{{ include "ragnerock.fullname" . }}-db-service:{{ include "ragnerock.number" .Values.dbService.service.port }}"
  MODEL_SERVICE_AUDIENCE: "http://{{ include "ragnerock.fullname" . }}-model-service:{{ include "ragnerock.number" .Values.modelService.service.port }}"
  SCHEDULER_AUDIENCE: "http://{{ include "ragnerock.fullname" . }}-data-ingestor:{{ include "ragnerock.number" .Values.dataIngestor.service.port }}"
  SUBTASK_WORKER_SERVICE_AUDIENCE: "http://{{ include "ragnerock.fullname" . }}-subtask-worker:{{ include "ragnerock.number" .Values.subtaskWorker.service.port }}"
  WORKER_SERVICE_AUDIENCE: "http://{{ include "ragnerock.fullname" . }}-worker:{{ include "ragnerock.number" .Values.worker.service.port }}"
  AUDIT_SERVICE_AUDIENCE: "http://{{ include "ragnerock.fullname" . }}-audit-service:{{ include "ragnerock.number" .Values.auditService.service.port }}"
  PYTHON_SERVICE_AUDIENCE: "http://{{ include "ragnerock.fullname" . }}-python-service:{{ include "ragnerock.number" .Values.pythonService.service.port }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-endpoints
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  ENDPOINTS_ALLOW_PRIVATE_CALLBACKS: "{{ .Values.endpoints.allowPrivateCallbacks }}"
  ENDPOINTS_EPHEMERAL_TTL_HOURS: "{{ include "ragnerock.number" .Values.endpoints.ephemeralTTLHours }}"
  ENDPOINTS_MAX_FILE_SIZE_MB: "{{ include "ragnerock.number" .Values.endpoints.maxFileSizeMB }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-ingest
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  INGEST_RUN_STALE_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.ingest.staleTimeoutSeconds }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-callback-delivery
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  CALLBACK_DELIVERY_URL: http://{{ include "ragnerock.fullname" . }}-callback-delivery:{{ include "ragnerock.number" .Values.callbackDelivery.service.port }}
  CALLBACK_ALLOWED_HOSTS: "ragnerock-api:8080"
  CALLBACK_HTTP_ALLOWED: "true"
---
# The callback-delivery service's OWN settings, separate from the map above:
# that one carries the service's URL and is mounted by everything that calls
# it, so anything added there lands in half the fleet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-callback-delivery-db
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  # See the audit-service map: explicit so the budget sums a visible number.
  DB_POOL_SIZE: "{{ include "ragnerock.number" .Values.callbackDelivery.database.poolSize }}"
  DB_MAX_OVERFLOW: "{{ include "ragnerock.number" .Values.callbackDelivery.database.maxOverflow }}"
  DB_POOL_TIMEOUT: "{{ include "ragnerock.number" .Values.callbackDelivery.database.poolTimeout }}"
  CAPACITY_RETRY_AFTER_SECONDS: "{{ include "ragnerock.number" .Values.callbackDelivery.database.capacityRetryAfterSeconds }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-analysis
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  DATAFRAME_OP_TIMEOUT: "{{ include "ragnerock.number" .Values.analysis.dataframeOpTimeout }}"
  MAX_COLUMNS: "{{ include "ragnerock.number" .Values.analysis.maxColumns }}"
  MAX_ROWS: "{{ include "ragnerock.number" .Values.analysis.maxRows }}"
  MODEL_FIT_TIMEOUT: "{{ include "ragnerock.number" .Values.analysis.modelFitTimeoutSeconds }}"
  PLOT_DPI: "{{ include "ragnerock.number" .Values.analysis.plotDPI }}"
  PLOT_MAX_FIGSIZE: "[{{ include "ragnerock.number" .Values.analysis.plotMaxFigsize.dimx }},{{ include "ragnerock.number" .Values.analysis.plotMaxFigsize.dimy }}]"
  PLOT_TIMEOUT: "{{ include "ragnerock.number" .Values.analysis.plotTimeoutSeconds }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-python
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  PYTHON_SERVICE_BATCH_CHUNK_ITEMS_MAX: "{{ include "ragnerock.number" .Values.python.batchChunkItemsMax }}"
  # Deliberately the SERVICE's own grace and request timeout, not separate
  # client values: the chunk size is derived from them, so a client that read a
  # different number would size chunks the service cannot honour.
  PYTHON_SERVICE_BATCH_STARTUP_GRACE_SECONDS: "{{ include "ragnerock.number" .Values.pythonService.sandbox.batchStartupGraceSeconds }}"
  PYTHON_SERVICE_CHUNK_CONCURRENCY: "{{ include "ragnerock.number" .Values.python.chunkConcurrency }}"
  PYTHON_SERVICE_HTTP_TIMEOUT_MARGIN_SECONDS: "{{ include "ragnerock.number" .Values.python.timeoutMarginSeconds }}"
  PYTHON_SERVICE_MAX_ATTEMPTS: "{{ include "ragnerock.number" .Values.python.maxAttempts }}"
  PYTHON_SERVICE_MAX_REQUEST_BYTES: "{{ include "ragnerock.number" .Values.python.maxRequestBytes }}"
  PYTHON_SERVICE_REQUEST_TIMEOUT_SECONDS: "{{ include "ragnerock.number" .Values.pythonService.requestTimeoutSeconds }}"
  PYTHON_SERVICE_URL: "http://{{ include "ragnerock.fullname" . }}-python-service:{{ include "ragnerock.number" .Values.pythonService.service.port }}"
---
# python-service's own sandbox configuration (packages/python-service
# settings.py). Distinct from the `-python` ConfigMap above, which holds the
# *client* knobs its callers use.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-python-service
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  MAX_TIMEOUT: "{{ include "ragnerock.number" .Values.pythonService.sandbox.maxTimeout }}"
  MAX_OUTPUT_BYTES: "{{ include "ragnerock.number" .Values.pythonService.sandbox.maxOutputBytes }}"
  MAX_RESULT_BYTES: "{{ include "ragnerock.number" .Values.pythonService.sandbox.maxResultBytes }}"
  MAX_REQUEST_BYTES: "{{ include "ragnerock.number" .Values.pythonService.sandbox.maxRequestBytes }}"
  BATCH_STARTUP_GRACE_SECONDS: "{{ include "ragnerock.number" .Values.pythonService.sandbox.batchStartupGraceSeconds }}"
  # The client's read-timeout slack, mirrored so the sandbox knows how far
  # past a request's budget it may run before the caller gives up. Same value
  # as the callers' PYTHON_SERVICE_HTTP_TIMEOUT_MARGIN_SECONDS.
  HTTP_TIMEOUT_MARGIN_SECONDS: "{{ include "ragnerock.number" .Values.python.timeoutMarginSeconds }}"
  RLIMIT_CPU_SECONDS: "{{ include "ragnerock.number" .Values.pythonService.sandbox.rlimitCPUSeconds }}"
  RLIMIT_CPU_PER_WALL_SECOND: "{{ include "ragnerock.number" .Values.pythonService.sandbox.rlimitCPUPerWallSecond }}"
  RLIMIT_CPU_HEADROOM_SECONDS: "{{ include "ragnerock.number" .Values.pythonService.sandbox.rlimitCPUHeadroomSeconds }}"
  RLIMIT_NPROC: "{{ include "ragnerock.number" .Values.pythonService.sandbox.rlimitNProc }}"
  RLIMIT_FSIZE_BYTES: "{{ include "ragnerock.number" .Values.pythonService.sandbox.rlimitFSizeBytes }}"
  RLIMIT_NOFILE: "{{ include "ragnerock.number" .Values.pythonService.sandbox.rlimitNoFile }}"
  RECYCLE_AFTER_N_EXECUTIONS: "{{ include "ragnerock.number" .Values.pythonService.sandbox.recycleAfterNExecutions }}"
  SANDBOX_ENFORCEMENT: "{{ .Values.pythonService.sandbox.enforcement }}"
---
# audit-service configuration: ingest-time derivation caps, the partition
# lifecycle, and the blob-export scan that self-dispatches /audit/export-run
# tasks. LOG_LEVEL / ENVIRONMENT_IDENTIFIER come from the shared `-config` map.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragnerock.fullname" . }}-audit-service
  labels:
    {{- include "ragnerock.labels" . | nindent 4 }}
data:
  # Named explicitly rather than left to SQLAlchemy's implicit 5 + 10: the
  # connection budget sums every service's geometry, and a library default is
  # a number nobody deploying can see.
  DB_POOL_SIZE: "{{ include "ragnerock.number" .Values.auditService.database.poolSize }}"
  DB_MAX_OVERFLOW: "{{ include "ragnerock.number" .Values.auditService.database.maxOverflow }}"
  DB_POOL_TIMEOUT: "{{ include "ragnerock.number" .Values.auditService.database.poolTimeout }}"
  CAPACITY_RETRY_AFTER_SECONDS: "{{ include "ragnerock.number" .Values.auditService.database.capacityRetryAfterSeconds }}"
  AUDIT_PROMPT_PREVIEW_MAX_CHARS: "{{ include "ragnerock.number" .Values.audit.promptPreviewMaxChars }}"
  AUDIT_ERROR_MESSAGE_MAX_CHARS: "{{ include "ragnerock.number" .Values.audit.errorMessageMaxChars }}"
  AUDIT_PARTITION_PRECREATE_MONTHS: "{{ include "ragnerock.number" .Values.auditService.partitionPrecreateMonths }}"
  AUDIT_EXPORT_RUN_URL: http://{{ include "ragnerock.fullname" . }}-audit-service:{{ include "ragnerock.number" .Values.auditService.service.port }}/audit/export-run
  AUDIT_EXPORT_RUN_AUDIENCE: http://{{ include "ragnerock.fullname" . }}-audit-service:{{ include "ragnerock.number" .Values.auditService.service.port }}
  AUDIT_EXPORT_WATERMARK_MINUTES: "{{ include "ragnerock.number" .Values.auditService.export.watermarkMinutes }}"
  AUDIT_EXPORT_SCAN_LOOKBACK_HOURS: "{{ include "ragnerock.number" .Values.auditService.export.scanLookbackHours }}"
  AUDIT_EXPORT_LAG_ALERT_MINUTES: "{{ include "ragnerock.number" .Values.auditService.export.lagAlertMinutes }}"
  # Every live-log ingest batch asks whether a tail is open; this bounds how
  # often that question reaches the lease table. The rest of the live-log
  # settings this service reads come from the `-live-log` and `-core` maps.
  LIVE_LOG_TAIL_CACHE_SECONDS: "{{ include "ragnerock.number" .Values.liveLog.buffer.tailCacheSeconds }}"
  CLOUD_TASKS_AUDIT_EXPORT_QUEUE_NAME: "{{ .Values.queue.auditExportQueueName }}"
  CLOUD_TASKS_ENABLED: "true"
  CLOUD_TASKS_PROJECT_ID: local
  CLOUD_TASKS_ENDPOINT: {{ include "ragnerock.fullname" . }}-queue:{{ include "ragnerock.number" .Values.queue.port }}
