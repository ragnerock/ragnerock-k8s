  # Without a retry config the Mistral SDK does not retry, so one 429 from the
  # OCR endpoint fails the whole document job.
  MISTRAL_RETRY_INITIAL_INTERVAL_MS: "{{ include "ragnerock.number" .Values.llm.mistral.retry.initialIntervalMS }}"
  MISTRAL_RETRY_MAX_INTERVAL_MS: "{{ include "ragnerock.number" .Values.llm.mistral.retry.maxIntervalMS }}"
  MISTRAL_RETRY_EXPONENT: "{{ include "ragnerock.number" .Values.llm.mistral.retry.exponent }}"
  MISTRAL_RETRY_MAX_ELAPSED_MS: "{{ include "ragnerock.number" .Values.llm.mistral.retry.maxElapsedMS }}"
{{- end }}
{{- if eq .Values.llm.pdfParserBackend "azure" }}
  AZURE_DOC_INTEL_ENDPOINT: "{{ .Values.llm.azure.endpoint }}"
{{- end }}
{{- if eq .Values.llm.pdfParserBackend "textract" }}
